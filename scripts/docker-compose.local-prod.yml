# LOCAL-PROD-201: SuperMandi local production stack
# Run: docker compose -f scripts/docker-compose.local-prod.yml up -d
# Stop: docker compose -f scripts/docker-compose.local-prod.yml stop
# Resume: docker compose -f scripts/docker-compose.local-prod.yml start
# Rebuild: docker compose -f scripts/docker-compose.local-prod.yml up -d --build
# ISSUE-MICRO-034: Secrets parameterized — override via scripts/.env or environment
# ISSUE-MICRO-035: Resource limits added to all services

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: supermandi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - supermandi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  api-gateway:
    image: supermandi/api-gateway:9bb03f7
    restart: unless-stopped
    ports: ["8080:3000"]
    environment:
      PORT: "3000"
      NODE_ENV: production
      ADMIN_SERVICE_URL: http://main-backend:3010
      PAYMENT_SERVICE_URL: http://payment-service:3011
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-test-token}
      JWT_SECRET: ${JWT_SECRET:-local-test-jwt-secret-32chars-minimum-ok}
      # LOCAL-PROD-URL-001: CORS origins for local frontend containers
      CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084"
    depends_on:
      main-backend:
        condition: service_healthy
    # LOCAL-PROD-URL-001: Use 127.0.0.1 to avoid IPv6 resolution issues in Alpine
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # DOCKER-BUILD-001: Build from source (was: stale image :2d7189d)
  main-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.main
    image: supermandi/main-backend:local
    restart: unless-stopped
    ports: ["3010:3010"]
    environment:
      PORT: "3010"
      # FIX-019-003: Pass GIT_SHA so /version reports correct commit
      GIT_SHA: "local"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/supermandi}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379
      # BB-ADMIN-002: getRedisConfig() reads REDIS_HOST (not REDIS_URL), defaults to localhost
      REDIS_HOST: redis
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-test-token}
      JWT_SECRET: ${JWT_SECRET:-local-test-jwt-secret-32chars-minimum-ok}
      CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084"
      ALLOWED_ORIGINS: "http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084"
      # DOCKER-ENV-001: Email service (Resend) — key from scripts/.env
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "SuperMandi <noreply@supermandi.tech>"
      # DOCKER-ENV-001: Firebase Admin SDK
      FIREBASE_ENABLED: "true"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-supermandi-pos}
      # DOCKER-ENV-001: Firebase SA JSON — set FIREBASE_SA_PATH in scripts/.env to enable
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      # BB-ADMIN-001: SuperAdmin email allowlist (was hardcoded, moved to env in ISSUE-MICRO-009)
      ADMIN_EMAIL_ALLOWLIST: ${ADMIN_EMAIL_ALLOWLIST:-supermanditech@gmail.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3010/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  auth-service:
    image: supermandi/auth-service:9bb03f7
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-local-test-jwt-secret-32chars-minimum-ok}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  catalog-service:
    image: supermandi/catalog-service:9bb03f7
    restart: unless-stopped
    environment:
      PORT: "3004"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-local-test-jwt-secret-32chars-minimum-ok}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  inventory-service:
    image: supermandi/inventory-service:9bb03f7
    restart: unless-stopped
    environment:
      PORT: "3005"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-local-test-jwt-secret-32chars-minimum-ok}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  order-service:
    image: supermandi/order-service:9bb03f7
    restart: unless-stopped
    environment:
      PORT: "3006"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      JWT_SECRET: ${JWT_SECRET:-local-test-jwt-secret-32chars-minimum-ok}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  payment-service:
    image: supermandi/payment-service:9bb03f7
    restart: unless-stopped
    environment:
      PORT: "3011"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/supermandi}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_local_prod}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-local_test_secret}
      RAZORPAY_ACCOUNT_NUMBER: ${RAZORPAY_ACCOUNT_NUMBER:-local_test_account}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  platform-service:
    image: supermandi/platform-service:9bb03f7
    restart: unless-stopped
    environment:
      PORT: "3002"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      INVENTORY_SERVICE_URL: http://inventory-service:3005
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  reorder-service:
    image: supermandi/reorder-service:9bb03f7
    restart: unless-stopped
    environment:
      PORT: "3007"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-local-test-jwt-secret-32chars-minimum-ok}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  supplier-service:
    image: supermandi/supplier-service:9bb03f7
    restart: unless-stopped
    environment:
      PORT: "3003"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-local-test-jwt-secret-32chars-minimum-ok}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  voice-service:
    image: supermandi/voice-service:9bb03f7
    restart: unless-stopped
    environment:
      PORT: "3008"
      NODE_ENV: production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-test}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # POST-BATCH-018: Build from source (was: stale image :9bb03f7)
  retailer-admin:
    build:
      context: ../retailer-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:8080"
        VITE_GIT_SHA: "local"
    image: supermandi/retailer-admin:local
    restart: unless-stopped
    ports: ["8081:80"]
    # POST-BATCH-017: Mount subpath-aware nginx config (serves /retailer/ prefix)
    volumes:
      - ../retailer-admin/nginx-local-prod.conf:/etc/nginx/conf.d/default.conf:ro
    # LOCAL-PROD-URL-001: Override Dockerfile healthcheck — use 127.0.0.1 to avoid
    # Alpine IPv6 resolution (localhost → [::1] → connection refused on IPv4-only nginx)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health.txt || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      # ISSUE-MICRO-104: Increased from 5s to 10s — static builds need extra startup time
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  supplier-portal:
    build:
      context: ../supplier-portal
      dockerfile: Dockerfile
      # POST-BATCH-017: Bake API gateway URL into Next.js build
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
        NEXT_PUBLIC_GIT_SHA: "local"
    image: supermandi/supplier-portal:local
    restart: unless-stopped
    # SUP-PORT-001: next start respects PORT env var (3001 from Dockerfile)
    ports: ["8082:3001"]
    # SUP-ROOT-001: basePath: '/supplier' — all routes require /supplier prefix
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/supplier/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # POST-BATCH-018: Build from source (was: stale image :9bb03f7)
  superadmin:
    build:
      context: ../supermandi-superadmin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:8080"
        VITE_GIT_SHA: "local"
    image: supermandi/superadmin:local
    restart: unless-stopped
    ports: ["8083:80"]
    # POST-BATCH-017: Mount subpath-aware nginx config (serves /admin/ prefix)
    volumes:
      - ../supermandi-superadmin/nginx-local-prod.conf:/etc/nginx/conf.d/default.conf:ro
    # LOCAL-PROD-URL-001: Override Dockerfile healthcheck — use 127.0.0.1 (IPv6 fix)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health.txt || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      # ISSUE-MICRO-104: Increased from 5s to 10s — static builds need extra startup time
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # POST-BATCH-018: Build from source (was: stale image :9bb03f7)
  landing:
    build:
      context: ../supermandi-landing
      dockerfile: Dockerfile
    image: supermandi/landing:local
    restart: unless-stopped
    ports: ["8084:80"]
    # LOCAL-PROD-URL-001: Override Dockerfile healthcheck — use 127.0.0.1 (IPv6 fix)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health.txt || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      # ISSUE-MICRO-104: Increased from 5s to 10s — static builds need extra startup time
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  supermandi-pgdata:
    name: supermandi-pgdata

# LOCAL-PROD-201: SuperMandi local production stack
# SHA: 2d7189d
# Run: docker compose -f scripts/docker-compose.local-prod.yml up -d
# Stop: docker compose -f scripts/docker-compose.local-prod.yml stop
# Resume: docker compose -f scripts/docker-compose.local-prod.yml start

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supermandi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - supermandi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-gateway:
    image: supermandi/api-gateway:9bb03f7
    ports: ["8080:3000"]
    environment:
      PORT: "3000"
      NODE_ENV: production
      ADMIN_SERVICE_URL: http://main-backend:3010
      PAYMENT_SERVICE_URL: http://payment-service:3011
      ADMIN_TOKEN: local-test-token
      JWT_SECRET: local-test-jwt-secret-32chars-minimum-ok
      # LOCAL-PROD-URL-001: CORS origins for local frontend containers
      CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084"
    depends_on:
      main-backend:
        condition: service_healthy
    # LOCAL-PROD-URL-001: Use 127.0.0.1 to avoid IPv6 resolution issues in Alpine
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  main-backend:
    image: supermandi/main-backend:2d7189d
    ports: ["3010:3010"]
    environment:
      PORT: "3010"
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/supermandi
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://redis:6379
      ADMIN_TOKEN: local-test-token
      JWT_SECRET: local-test-jwt-secret-32chars-minimum-ok
      CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084"
      ALLOWED_ORIGINS: "http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3010/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  auth-service:
    image: supermandi/auth-service:9bb03f7
    environment:
      PORT: "3001"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-test-jwt-secret-32chars-minimum-ok
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    image: supermandi/catalog-service:9bb03f7
    environment:
      PORT: "3004"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: local-test-jwt-secret-32chars-minimum-ok
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  inventory-service:
    image: supermandi/inventory-service:9bb03f7
    environment:
      PORT: "3005"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-test-jwt-secret-32chars-minimum-ok
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    image: supermandi/order-service:9bb03f7
    environment:
      PORT: "3006"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: postgres
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      JWT_SECRET: local-test-jwt-secret-32chars-minimum-ok
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    image: supermandi/payment-service:9bb03f7
    environment:
      PORT: "3011"
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/supermandi
      RAZORPAY_KEY_ID: rzp_test_local_prod
      RAZORPAY_KEY_SECRET: local_test_secret
      RAZORPAY_ACCOUNT_NUMBER: local_test_account
    depends_on:
      postgres:
        condition: service_healthy

  platform-service:
    image: supermandi/platform-service:9bb03f7
    environment:
      PORT: "3002"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: postgres
      INVENTORY_SERVICE_URL: http://inventory-service:3005
    depends_on:
      postgres:
        condition: service_healthy

  reorder-service:
    image: supermandi/reorder-service:9bb03f7
    environment:
      PORT: "3007"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: local-test-jwt-secret-32chars-minimum-ok
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  supplier-service:
    image: supermandi/supplier-service:9bb03f7
    environment:
      PORT: "3003"
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-test-jwt-secret-32chars-minimum-ok
    depends_on:
      postgres:
        condition: service_healthy

  voice-service:
    image: supermandi/voice-service:9bb03f7
    environment:
      PORT: "3008"
      NODE_ENV: production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-test}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: supermandi
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  retailer-admin:
    image: supermandi/retailer-admin:9bb03f7
    ports: ["8081:80"]
    # LOCAL-PROD-URL-001: Override Dockerfile healthcheck — use 127.0.0.1 to avoid
    # Alpine IPv6 resolution (localhost → [::1] → connection refused on IPv4-only nginx)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health.txt || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  supplier-portal:
    image: supermandi/supplier-portal:9bb03f7
    # LOCAL-PROD-URL-001: package.json uses "next start -p 4001" (overrides Dockerfile PORT=3001)
    ports: ["8082:4001"]
    # LOCAL-PROD-URL-001: Override Dockerfile healthcheck (probes port 3001 but app runs on 4001)
    # LOCAL-PROD-URL-002: next.config.js has basePath: '/supplier' — all routes require /supplier prefix
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4001/supplier/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  superadmin:
    image: supermandi/superadmin:9bb03f7
    ports: ["8083:80"]
    # LOCAL-PROD-URL-001: Override Dockerfile healthcheck — use 127.0.0.1 (IPv6 fix)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health.txt || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  landing:
    image: supermandi/landing:9bb03f7
    ports: ["8084:80"]
    # LOCAL-PROD-URL-001: Override Dockerfile healthcheck — use 127.0.0.1 (IPv6 fix)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health.txt || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  supermandi-pgdata:
    name: supermandi-pgdata

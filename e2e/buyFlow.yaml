# BUY Flow E2E Test - V3.0.9 compliant
# Tests complete BUY cycle: browse catalog, add to cart, create purchase order

appId: com.supermanditech.supermandipos
name: "BUY Flow - Complete Purchase Order Cycle"
tags:
  - smoke
  - buy
  - regression

---

# =============================================================================
# SETUP: Ensure we're logged in
# =============================================================================

- launchApp:
    clearState: false

# Wait for app to load
- extendedWaitUntil:
    visible:
      anyOf:
        - "SELL"
        - "BUY"
    timeout: 15000

# =============================================================================
# STEP 1: Navigate to BUY tab
# =============================================================================

- tapOn:
    text: "BUY"

# Verify we're on the BUY screen
- extendedWaitUntil:
    visible: "Search products"
    timeout: 5000

# =============================================================================
# STEP 2: Browse product catalog
# =============================================================================

# Wait for products to load
- extendedWaitUntil:
    visible:
      anyOf:
        - "Test Product"
        - "No products"
    timeout: 10000

# If we have a category filter, tap on it
- tapOn:
    text: "All"
    optional: true

# =============================================================================
# STEP 3: Search for a product
# =============================================================================

# Tap on search bar
- tapOn:
    text: "Search products"

# Enter search term
- inputText: "Test"

# Wait for filtered results
- extendedWaitUntil:
    visible: "Test Product"
    timeout: 5000

# =============================================================================
# STEP 4: Add product to purchase cart
# =============================================================================

# Tap on product to view details or add button
- tapOn:
    text: "Test Product"

# Wait for product modal or add confirmation
- extendedWaitUntil:
    visible:
      anyOf:
        - "Add to Cart"
        - "Select Supplier"
        - "1"  # Quantity badge
    timeout: 5000

# If there's a supplier selection modal
- conditional:
    visible: "Select Supplier"
    commands:
      - tapOn:
          text: "Test Supplier"
      - inputText: "10"  # Quantity
      - tapOn:
          text: "Add to Cart"

# If direct add button
- tapOn:
    text: "Add to Cart"
    optional: true

# =============================================================================
# STEP 5: Open purchase cart
# =============================================================================

# Look for cart icon or button
- tapOn:
    text: "Cart"
    optional: true

- tapOn:
    id: "purchase-cart-button"
    optional: true

# Wait for cart modal
- extendedWaitUntil:
    visible: "Purchase Cart"
    timeout: 5000

# =============================================================================
# STEP 6: Review cart items
# =============================================================================

# Verify cart has items
- assertVisible: "Test Product"

# Verify supplier grouping
- assertVisible:
    text: "Test Supplier"
    optional: true

# Verify total amount
- assertVisible: "Total"

# =============================================================================
# STEP 7: Create purchase order
# =============================================================================

# Tap create order button
- tapOn:
    text: "Create Order"
    optional: true

- tapOn:
    text: "Submit"
    optional: true

# Confirm if there's a confirmation dialog
- tapOn:
    text: "Confirm"
    optional: true

# =============================================================================
# STEP 8: Verify order creation
# =============================================================================

# Wait for success message or order confirmation
- extendedWaitUntil:
    visible:
      anyOf:
        - "Order Created"
        - "Success"
        - "PO-"  # Order number format
    timeout: 10000

# Close success message
- tapOn:
    text: "Done"
    optional: true

- tapOn:
    text: "OK"
    optional: true

- back:
    optional: true

# =============================================================================
# STEP 9: Verify order in history (optional)
# =============================================================================

# Navigate to order history
- tapOn:
    text: "Orders"
    optional: true

# Verify recent order is visible
- conditional:
    visible: "Order History"
    commands:
      - assertVisible:
          text: "PO-"
          timeout: 5000

# =============================================================================
# VERIFICATION: Return to BUY tab
# =============================================================================

- tapOn:
    text: "BUY"
    optional: true

- extendedWaitUntil:
    visible: "Search products"
    timeout: 5000

# Log success
- evalScript: console.log('✅ BUY flow completed successfully')

# PM-BATCH-K: Voice Add-to-Cart Flow Lock
# Tests: voice button → recording → processing → result (add or disambiguate)
# Invariant: voice button triggers recording, result either adds or shows options

appId: com.supermanditech.supermandipos
name: "Voice Add-to-Cart - Record and Process"
tags:
  - smoke
  - sell
  - voice
  - regression
  - batch-k

---

# =============================================================================
# SETUP: Navigate to SELL tab
# =============================================================================

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "SELL"
    timeout: 15000

- tapOn:
    text: "SELL"
    optional: true

# =============================================================================
# STEP 1: Verify voice button is visible
# =============================================================================

# Voice button should be present (microphone icon)
- assertVisible:
    id: "voice-button"
    timeout: 5000

# =============================================================================
# STEP 2: Press and hold voice button to start recording
# =============================================================================

# Long press to start recording
- longPressOn:
    id: "voice-button"
    duration: 2000

# =============================================================================
# STEP 3: Verify recording state
# =============================================================================

# Voice sheet should appear with recording indicator
- extendedWaitUntil:
    visible:
      anyOf:
        - "Listening"
        - "Recording"
        - "Release"
    timeout: 3000

# =============================================================================
# STEP 4: Release to submit
# =============================================================================

# After release, should transition to processing
- extendedWaitUntil:
    visible:
      anyOf:
        - "Processing"
        - "Done"
        - "Couldn't understand"
        - "Added"
    timeout: 10000

# =============================================================================
# STEP 5: Handle result
# =============================================================================

# SUCCESS case: product added to cart
- conditional:
    visible: "Done"
    commands:
      - evalScript: console.log('Voice: product added successfully')

# DISAMBIGUATION case: multiple matches shown
- conditional:
    visible: "Select"
    commands:
      - evalScript: console.log('Voice: disambiguation shown (expected for multi-match)')

# ERROR case: couldn't understand (acceptable - depends on mic/environment)
- conditional:
    visible: "Couldn't understand"
    commands:
      - evalScript: console.log('Voice: could not understand (acceptable in test environment)')

# =============================================================================
# STEP 6: Dismiss voice sheet (auto-dismisses after 3s)
# =============================================================================

# Wait for sheet to auto-dismiss or tap to dismiss
- tapOn:
    text: "SELL"
    optional: true

- back:
    optional: true

# =============================================================================
# VERIFY: Still on SELL tab, app is responsive
# =============================================================================

- extendedWaitUntil:
    visible: "SELL"
    timeout: 5000

- assertVisible: "Search by name or barcode"

- evalScript: console.log('Voice add-to-cart flow completed successfully')

# GRN Flow E2E Test - V3.0.9 compliant
# Tests GRN cycle: select order, enter received quantities, submit GRN

appId: com.supermanditech.supermandipos
name: "GRN Flow - Receive Goods Against Order"
tags:
  - smoke
  - grn
  - regression

---

# =============================================================================
# SETUP: Ensure we're logged in
# =============================================================================

- launchApp:
    clearState: false

# Wait for app to load
- extendedWaitUntil:
    visible:
      anyOf:
        - "SELL"
        - "Orders"
    timeout: 15000

# =============================================================================
# STEP 1: Navigate to Order History
# =============================================================================

# Open menu or navigate to orders
- tapOn:
    text: "Orders"
    optional: true

- tapOn:
    text: "Order History"
    optional: true

# Tap menu icon if orders not directly visible
- tapOn:
    id: "menu-button"
    optional: true

- tapOn:
    text: "Orders"
    optional: true

# Wait for order list
- extendedWaitUntil:
    visible:
      anyOf:
        - "Order History"
        - "Purchase Orders"
        - "PO-"
    timeout: 10000

# =============================================================================
# STEP 2: Find confirmed order for receiving
# =============================================================================

# Filter by confirmed status if filter available
- tapOn:
    text: "Confirmed"
    optional: true

- tapOn:
    text: "Filter"
    optional: true

# Check if there are confirmed orders
- conditional:
    visible: "No orders"
    commands:
      - evalScript: console.log('ℹ️ No confirmed orders - skipping GRN flow')
      - stopFlow

# Wait for orders list
- extendedWaitUntil:
    visible: "PO-"
    timeout: 5000

# =============================================================================
# STEP 3: Select order for GRN
# =============================================================================

# Tap on first confirmed order
- tapOn:
    text: "PO-"
    index: 0

# Wait for order details screen
- extendedWaitUntil:
    visible:
      anyOf:
        - "Order Details"
        - "Items"
        - "Receive"
    timeout: 5000

# =============================================================================
# STEP 4: Start GRN process
# =============================================================================

# Tap receive/GRN button
- tapOn:
    text: "Receive"
    optional: true

- tapOn:
    text: "Create GRN"
    optional: true

- tapOn:
    text: "Receive Goods"
    optional: true

# Wait for GRN screen
- extendedWaitUntil:
    visible:
      anyOf:
        - "Goods Receiving"
        - "GRN"
        - "Receive Quantities"
    timeout: 5000

# =============================================================================
# STEP 5: Enter received quantities
# =============================================================================

# Verify order items are visible
- assertVisible: "Test Product"

# Tap on first item's quantity input
- tapOn:
    id: "grn-quantity-input"
    index: 0
    optional: true

# Clear and enter received quantity
- clearText
- inputText: "10"

# If there's a "Receive All" button, use it
- tapOn:
    text: "Receive All"
    optional: true

# Tap on second item if exists
- tapOn:
    id: "grn-quantity-input"
    index: 1
    optional: true

- conditional:
    visible:
      id: "grn-quantity-input"
      index: 1
    commands:
      - clearText
      - inputText: "5"

# =============================================================================
# STEP 6: Add GRN notes (optional)
# =============================================================================

# Tap notes field if available
- tapOn:
    text: "Notes"
    optional: true

- tapOn:
    id: "grn-notes-input"
    optional: true

# Enter notes
- conditional:
    visible:
      id: "grn-notes-input"
    commands:
      - inputText: "Full delivery received - E2E test"

# =============================================================================
# STEP 7: Submit GRN
# =============================================================================

# Verify submit button is enabled
- assertVisible:
    text: "Submit"
    timeout: 3000

# Tap submit
- tapOn:
    text: "Submit"

# Confirm submission
- tapOn:
    text: "Confirm"
    optional: true

- tapOn:
    text: "Yes"
    optional: true

# =============================================================================
# STEP 8: Verify GRN completion
# =============================================================================

# Wait for success message
- extendedWaitUntil:
    visible:
      anyOf:
        - "GRN Created"
        - "Success"
        - "Goods Received"
    timeout: 10000

# Close success message
- tapOn:
    text: "OK"
    optional: true

- tapOn:
    text: "Done"
    optional: true

# =============================================================================
# STEP 9: Verify order status updated
# =============================================================================

# Go back to order details
- back:
    optional: true

# Verify order status changed to received
- conditional:
    visible: "Order Details"
    commands:
      - assertVisible:
          text:
            anyOf:
              - "Received"
              - "Completed"
              - "Partially Received"
          timeout: 5000

# =============================================================================
# STEP 10: Verify inventory updated (optional)
# =============================================================================

# Navigate to inventory view if available
- tapOn:
    text: "Inventory"
    optional: true

# Verify stock increased (would need specific product stock check)
- conditional:
    visible: "Inventory"
    commands:
      - tapOn:
          text: "Test Product"
          optional: true
      - assertVisible:
          text: "Stock"
          optional: true

# =============================================================================
# VERIFICATION: Return to main screen
# =============================================================================

- back:
    optional: true

- tapOn:
    text: "SELL"
    optional: true

- extendedWaitUntil:
    visible:
      anyOf:
        - "SELL"
        - "Search"
    timeout: 5000

# Log success
- evalScript: console.log('✅ GRN flow completed successfully')

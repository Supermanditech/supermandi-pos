# SELL Flow E2E Test - V3.0.9 compliant
# Tests complete SELL cycle: search/scan product, add to cart, apply discount, checkout

appId: com.supermanditech.supermandipos
name: "SELL Flow - Complete Sale Cycle"
tags:
  - smoke
  - sell
  - regression

---

# =============================================================================
# SETUP: Ensure we're logged in and on SELL tab
# =============================================================================

- launchApp:
    clearState: false

# Wait for app to load
- extendedWaitUntil:
    visible: "SELL"
    timeout: 15000

# Navigate to SELL tab if not already there
- tapOn:
    text: "SELL"
    optional: true

# =============================================================================
# STEP 1: Search for a product
# =============================================================================

- assertVisible: "Search by name or barcode"

# Tap search input
- tapOn:
    text: "Search by name or barcode"

# Enter search query
- inputText: "Test Product"

# Wait for search results
- extendedWaitUntil:
    visible: "Test Product"
    timeout: 5000

# =============================================================================
# STEP 2: Add product to cart
# =============================================================================

# Tap on product to add to cart (or use + button)
- tapOn:
    text: "Test Product"

# Verify product added - cart should show item count
- assertVisible:
    text: "1"
    timeout: 3000

# =============================================================================
# STEP 3: Increase quantity
# =============================================================================

# Tap plus button to increase quantity
- tapOn:
    id: "cart-item-plus"
    optional: true

# Or tap on the quantity to open editor
- tapOn:
    text: "1"
    optional: true

# =============================================================================
# STEP 4: Apply cart discount (optional)
# =============================================================================

# Look for discount option
- tapOn:
    text: "Discount"
    optional: true

# If discount modal opens, apply 10% discount
- conditional:
    visible: "Apply Discount"
    commands:
      - tapOn:
          text: "10%"
      - tapOn:
          text: "Apply"

# =============================================================================
# STEP 5: Proceed to checkout
# =============================================================================

# Verify cart total is visible
- assertVisible:
    text: "Total"
    timeout: 3000

# Tap on checkout/pay button
- tapOn:
    text: ".*Pay.*"
    regex: true
    optional: true

- tapOn:
    text: "Checkout"
    optional: true

# =============================================================================
# STEP 6: Complete payment
# =============================================================================

# Wait for payment screen
- extendedWaitUntil:
    visible: "Payment"
    timeout: 5000

# Select cash payment (default)
- tapOn:
    text: "CASH"
    optional: true

# Enter received amount or tap exact amount
- tapOn:
    text: "Exact"
    optional: true

# Confirm payment
- tapOn:
    text: "Complete Sale"
    optional: true

- tapOn:
    text: "Confirm"
    optional: true

# =============================================================================
# STEP 7: Verify sale completion
# =============================================================================

# Wait for success screen or receipt
- extendedWaitUntil:
    visible:
      anyOf:
        - "Success"
        - "Sale Complete"
        - "Receipt"
    timeout: 10000

# Return to sell screen
- tapOn:
    text: "New Sale"
    optional: true

- tapOn:
    text: "Done"
    optional: true

- back:
    optional: true

# =============================================================================
# VERIFICATION: Confirm we're back on SELL tab
# =============================================================================

- extendedWaitUntil:
    visible: "SELL"
    timeout: 5000

- assertVisible: "Search by name or barcode"

# Log success
- evalScript: console.log('✅ SELL flow completed successfully')

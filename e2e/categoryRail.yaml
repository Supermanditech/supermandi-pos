# PM-BATCH-K: Category Rail Navigation Flow Lock
# Tests: category rail shows → select category → products change → select "Sab" (all)
# Invariant: category selection filters products, "Sab" shows all

appId: com.supermanditech.supermandipos
name: "Category Rail - Browse and Filter"
tags:
  - smoke
  - sell
  - category
  - regression
  - batch-k

---

# =============================================================================
# SETUP: Navigate to SELL tab
# =============================================================================

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "SELL"
    timeout: 15000

- tapOn:
    text: "SELL"
    optional: true

# =============================================================================
# STEP 1: Verify category rail is visible
# =============================================================================

# The category rail should show "Sab" (All) as default selected
- assertVisible:
    text: "Sab"
    timeout: 5000

# Verify at least one FMCG category is visible
- assertVisible:
    text:
      anyOf:
        - "Atta-Dal"
        - "Chawal"
        - "Masala"
    timeout: 3000

# =============================================================================
# STEP 2: Select a specific category (Atta-Dal)
# =============================================================================

- tapOn:
    text: "Atta-Dal"

# Wait for products to load for this category
- extendedWaitUntil:
    visible:
      anyOf:
        - "Atta"
        - "Dal"
        - "No products"
        - ".*atta.*"
    timeout: 5000
    regex: true

# =============================================================================
# STEP 3: Select another category (Masala)
# =============================================================================

- tapOn:
    text: "Masala"

# Products should change
- extendedWaitUntil:
    visible:
      anyOf:
        - "Masala"
        - "No products"
        - ".*masala.*"
    timeout: 5000
    regex: true

# =============================================================================
# STEP 4: Select "Baaki" (Others / uncategorized)
# =============================================================================

# Scroll right to find Baaki if needed
- tapOn:
    text: "Baaki"
    optional: true

# If visible, verify it filters
- conditional:
    visible: "Baaki"
    commands:
      - tapOn:
          text: "Baaki"

# =============================================================================
# STEP 5: Return to "Sab" (All) - verify all products show
# =============================================================================

- tapOn:
    text: "Sab"

# Verify category filter is cleared (all products visible)
- extendedWaitUntil:
    visible:
      anyOf:
        - "Total"
        - "Search by name or barcode"
        - ".*Product.*"
    timeout: 5000
    regex: true

# =============================================================================
# VERIFY: Category rail still functional
# =============================================================================

- assertVisible: "Sab"
- assertVisible:
    text:
      anyOf:
        - "Atta-Dal"
        - "Chawal"
        - "Masala"
    timeout: 2000

- evalScript: console.log('Category rail navigation flow completed successfully')

# PM-BATCH-K: SELL First-Time Onboarding Flow Lock
# Tests: unknown barcode → onboarding modal → create product → add to cart → checkout
# Invariant: unknown barcodes trigger onboarding, product is created and added

appId: com.supermanditech.supermandipos
name: "SELL First-Time Onboarding - Create and Checkout"
tags:
  - smoke
  - sell
  - regression
  - batch-k

---

# =============================================================================
# SETUP: Ensure logged in and on SELL tab
# =============================================================================

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "SELL"
    timeout: 15000

- tapOn:
    text: "SELL"
    optional: true

# =============================================================================
# STEP 1: Enter an unknown barcode to trigger onboarding
# =============================================================================

- assertVisible: "Search by name or barcode"

- tapOn:
    text: "Search by name or barcode"

# Use a barcode that definitely doesn't exist in the store
- inputText: "9999999999999"

# Wait for "no results" state or onboarding trigger
- extendedWaitUntil:
    visible:
      anyOf:
        - "Add New"
        - "Create"
        - "Not found"
        - "No results"
        - "New Product"
    timeout: 8000

# =============================================================================
# STEP 2: Trigger onboarding modal
# =============================================================================

# Tap to create new product (various button labels)
- tapOn:
    text: "Add New"
    optional: true

- tapOn:
    text: "Create"
    optional: true

# =============================================================================
# STEP 3: Fill onboarding form
# =============================================================================

# Wait for onboarding modal/form
- extendedWaitUntil:
    visible:
      anyOf:
        - "Product Name"
        - "Name"
        - "Sell Price"
    timeout: 5000

# Enter product name
- conditional:
    visible: "Product Name"
    commands:
      - tapOn:
          text: "Product Name"
      - inputText: "Test Onboarding Product"

# Enter sell price (required)
- conditional:
    visible: "Sell Price"
    commands:
      - tapOn:
          text: "Sell Price"
      - inputText: "100"

# Enter purchase price (optional)
- conditional:
    visible: "Purchase Price"
    commands:
      - tapOn:
          text: "Purchase Price"
          optional: true
      - inputText: "80"

# =============================================================================
# STEP 4: Submit onboarding form → add to cart
# =============================================================================

# Tap save/add button
- tapOn:
    text: ".*Add.*"
    regex: true
    optional: true

- tapOn:
    text: "Save"
    optional: true

- tapOn:
    text: "Create"
    optional: true

# Verify product is in cart
- extendedWaitUntil:
    visible:
      anyOf:
        - "Total"
        - "Test Onboarding Product"
        - "Cart"
    timeout: 5000

# =============================================================================
# STEP 5: Proceed to checkout
# =============================================================================

- tapOn:
    text: ".*Pay.*"
    regex: true
    optional: true

- tapOn:
    text: "Checkout"
    optional: true

# =============================================================================
# STEP 6: Complete payment
# =============================================================================

- extendedWaitUntil:
    visible: "Payment"
    timeout: 5000

- tapOn:
    text: "CASH"
    optional: true

- tapOn:
    text: "Exact"
    optional: true

- tapOn:
    text: "Complete Sale"
    optional: true

- tapOn:
    text: "Confirm"
    optional: true

# =============================================================================
# STEP 7: Verify completion
# =============================================================================

- extendedWaitUntil:
    visible:
      anyOf:
        - "Success"
        - "Sale Complete"
        - "Receipt"
    timeout: 10000

- tapOn:
    text: "New Sale"
    optional: true

- tapOn:
    text: "Done"
    optional: true

- back:
    optional: true

# =============================================================================
# VERIFY: Back on SELL tab
# =============================================================================

- extendedWaitUntil:
    visible: "SELL"
    timeout: 5000

- evalScript: console.log('SELL first-time onboarding flow completed successfully')

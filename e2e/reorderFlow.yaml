# REORDER Flow E2E Test - V3.0.9 compliant
# Tests REORDER cycle: view pending reorders, select items, approve to cart

appId: com.supermanditech.supermandipos
name: "REORDER Flow - Approve Pending Reorders"
tags:
  - smoke
  - reorder
  - regression

---

# =============================================================================
# SETUP: Ensure we're logged in
# =============================================================================

- launchApp:
    clearState: false

# Wait for app to load
- extendedWaitUntil:
    visible:
      anyOf:
        - "SELL"
        - "REORDER"
    timeout: 15000

# =============================================================================
# STEP 1: Navigate to REORDER tab
# =============================================================================

- tapOn:
    text: "REORDER"

# Wait for reorder screen to load
- extendedWaitUntil:
    visible:
      anyOf:
        - "Pending Reorders"
        - "No pending"
        - "Low Stock"
    timeout: 10000

# =============================================================================
# STEP 2: View pending reorders list
# =============================================================================

# Check if there are pending reorders
- conditional:
    visible: "No pending"
    commands:
      - evalScript: console.log('ℹ️ No pending reorders - skipping approval flow')
      - stopFlow

# If we have pending reorders, continue
- assertVisible:
    text: ".*Stock.*"
    regex: true
    timeout: 5000

# =============================================================================
# STEP 3: View reorder item details
# =============================================================================

# Tap on first pending reorder item
- tapOn:
    text: "Test Product"
    index: 0
    optional: true

# If detail modal opens, verify details
- conditional:
    visible: "Current Stock"
    commands:
      - assertVisible: "Min Threshold"
      - assertVisible: "Suggested Qty"
      - back

# =============================================================================
# STEP 4: Select items for approval
# =============================================================================

# Tap checkbox to select first item
- tapOn:
    id: "reorder-checkbox"
    index: 0
    optional: true

# Or tap select all if available
- tapOn:
    text: "Select All"
    optional: true

# Verify selection indicator
- assertVisible:
    text: ".*selected.*"
    regex: true
    optional: true

# =============================================================================
# STEP 5: Approve selected items
# =============================================================================

# Tap approve button
- tapOn:
    text: "Approve"

# Wait for confirmation dialog
- extendedWaitUntil:
    visible:
      anyOf:
        - "Approve"
        - "Confirm"
        - "Create Orders"
    timeout: 5000

# Confirm approval
- tapOn:
    text: "Confirm"
    optional: true

- tapOn:
    text: "Yes"
    optional: true

# =============================================================================
# STEP 6: Verify items added to cart
# =============================================================================

# Wait for success message
- extendedWaitUntil:
    visible:
      anyOf:
        - "Added to Cart"
        - "Orders Created"
        - "Success"
    timeout: 10000

# Close success message
- tapOn:
    text: "OK"
    optional: true

- tapOn:
    text: "Done"
    optional: true

- tapOn:
    text: "View Cart"
    optional: true

# =============================================================================
# STEP 7: Verify cart has approved items (optional)
# =============================================================================

# Navigate to BUY tab to check cart
- tapOn:
    text: "BUY"
    optional: true

# Open purchase cart
- tapOn:
    text: "Cart"
    optional: true

# Verify items in cart
- conditional:
    visible: "Purchase Cart"
    commands:
      - assertVisible: "Test Product"
      - back

# =============================================================================
# STEP 8: Dismiss a pending reorder (alternative flow)
# =============================================================================

# Go back to REORDER tab
- tapOn:
    text: "REORDER"
    optional: true

# If there are still pending items, test dismiss
- conditional:
    visible: "Test Product"
    commands:
      # Long press or tap dismiss button
      - tapOn:
          text: "Dismiss"
          optional: true
      # Enter dismiss reason
      - conditional:
          visible: "Reason"
          commands:
            - inputText: "Stock count was incorrect"
            - tapOn:
                text: "Confirm"

# =============================================================================
# VERIFICATION: Confirm reorder flow complete
# =============================================================================

- assertVisible:
    text:
      anyOf:
        - "REORDER"
        - "Pending"
        - "No pending"
    timeout: 5000

# Log success
- evalScript: console.log('✅ REORDER flow completed successfully')

server {
    listen 80;
    server_name _;
    max_ranges 0;
    root /usr/share/nginx/html;
    index index.html;

    # Server-level security headers (apply to locations WITHOUT their own add_header)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP-FONTS-001: style-src includes fonts.googleapis.com, font-src includes fonts.gstatic.com
    # for Google Fonts (Inter) used on landing page
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'" always;

    location = /privacy {
        try_files /privacy.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP-FONTS-001: style-src includes fonts.googleapis.com, font-src includes fonts.gstatic.com
    # for Google Fonts (Inter) used on landing page
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'" always;
    }

    location = /terms {
        try_files /terms.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP-FONTS-001: style-src includes fonts.googleapis.com, font-src includes fonts.gstatic.com
    # for Google Fonts (Inter) used on landing page
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'" always;
    }

    location = /pos {
        try_files /pos.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP-FONTS-001: style-src includes fonts.googleapis.com, font-src includes fonts.gstatic.com
    # for Google Fonts (Inter) used on landing page
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'" always;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP-FONTS-001: style-src includes fonts.googleapis.com, font-src includes fonts.gstatic.com
    # for Google Fonts (Inter) used on landing page
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'" always;
    }

    # STG-181: Serve robots.txt and sitemap.xml with appropriate caching
    location = /robots.txt {
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # STG-182: Redirect bare /s to /s/ — fallback in case GCP URL map sends it here
    location = /s {
        return 301 /s/;
    }

    location / {
        try_files $uri =404;
    }
}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playstore Assets Preview</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f4f6fb;
      color: #111827;
    }
    h1 { margin: 0 0 16px; }
    .card {
      background: #fff;
      border: 1px solid #dbe3f0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .meta {
      color: #4b5563;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .icon {
      width: 256px;
      height: 256px;
      image-rendering: auto;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
    }
    .header {
      width: 100%;
      max-width: 1200px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      display: block;
    }
    code {
      background: #eef2ff;
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>Google Play Console Asset Preview</h1>

  <div class="card">
    <div class="meta"><strong>Developer Icon</strong> | 512 x 512 | PNG</div>
    <img class="icon" src="./developer-icon-512.png" alt="Developer Icon">
    <p><code>supermandi-landing/playstore-assets/developer-icon-512.png</code></p>
  </div>

  <div class="card">
    <div class="meta"><strong>Header Image</strong> | 4096 x 2304 | JPEG</div>
    <img class="header" src="./developer-header-4096x2304.jpg" alt="Header Image">
    <p><code>supermandi-landing/playstore-assets/developer-header-4096x2304.jpg</code></p>
  </div>
</body>
</html>

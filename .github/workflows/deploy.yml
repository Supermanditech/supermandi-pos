# CD-WORKFLOW-001: Build images → Push to AR → Auto-deploy staging Cloud Run
# Triggers after CI gates pass on push to main.
# Production deploy is MANUAL via promote-to-prod.sh (CD-201 enforced).

name: CD — Build & Deploy Staging

on:
  workflow_run:
    workflows: ["CI Gates (Zero-Regression)"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA to deploy (default: HEAD)'
        required: false
        type: string

env:
  GCP_PROJECT: supermandi-backend
  GCP_REGION: asia-south1
  AR_REPO: asia-south1-docker.pkg.dev/supermandi-backend/supermandi

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Gate: Only deploy if CI passed
  # ==========================================================================
  gate:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      sha_short: ${{ steps.sha.outputs.sha_short }}
      app_version: ${{ steps.appver.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}

      - name: Determine SHA
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "Deploying SHA: $SHA_SHORT ($SHA)"

      # SA-P2-003-AUTO: Extract POS app version for min-version enforcement
      - name: Extract app version
        id: appver
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $APP_VERSION"

  # ==========================================================================
  # Build all 6 Docker images and push to Artifact Registry
  # (2 backend: api-gateway + main-backend, 4 frontends)
  # ==========================================================================
  build-push:
    name: Build & Push Images
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for WIF
    env:
      SHA: ${{ needs.gate.outputs.sha_short }}
      BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.workflow_run.created_at }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Configure Docker for AR
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set build time
        run: echo "BUILD_TIME=$(date -Iseconds)" >> "$GITHUB_ENV"

      # --- Backend services (2 images: api-gateway + main-backend) ---
      - name: Build api-gateway
        run: |
          echo "--- Building: api-gateway"
          docker build \
            -t "${{ env.AR_REPO }}/api-gateway:${{ env.SHA }}" \
            -f "backend/services/api-gateway/Dockerfile" \
            --build-arg GIT_SHA="${{ env.SHA }}" \
            --build-arg BUILD_TIME="${{ env.BUILD_TIME }}" \
            backend/
          echo "    OK: api-gateway"

      - name: Build main-backend
        run: |
          echo "--- Building: main-backend"
          docker build \
            -t "${{ env.AR_REPO }}/main-backend:${{ env.SHA }}" \
            -f "backend/Dockerfile.main" \
            --build-arg GIT_SHA="${{ env.SHA }}" \
            --build-arg BUILD_TIME="${{ env.BUILD_TIME }}" \
            backend/
          echo "    OK: main-backend"

      # --- Frontend portals (4 images) ---
      # STAGING-FIREBASE-001: Firebase config injected at build time for phone OTP
      - name: Build retailer-admin
        run: |
          docker build \
            -t "${{ env.AR_REPO }}/retailer-admin:${{ env.SHA }}" \
            -f retailer-admin/Dockerfile \
            --build-arg VITE_API_BASE_URL="" \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            retailer-admin/

      - name: Build supplier-portal
        run: |
          docker build \
            -t "${{ env.AR_REPO }}/supplier-portal:${{ env.SHA }}" \
            -f supplier-portal/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL="" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            supplier-portal/

      - name: Build superadmin
        run: |
          docker build \
            -t "${{ env.AR_REPO }}/superadmin:${{ env.SHA }}" \
            -f supermandi-superadmin/Dockerfile \
            --build-arg VITE_API_BASE_URL="" \
            supermandi-superadmin/

      - name: Build landing
        run: |
          docker build \
            -t "${{ env.AR_REPO }}/landing:${{ env.SHA }}" \
            -f supermandi-landing/Dockerfile \
            supermandi-landing/

      # --- Push all 6 images ---
      - name: Push all images to AR
        run: |
          IMAGES=(
            api-gateway main-backend
            retailer-admin supplier-portal superadmin landing
          )
          PASSED=0
          FAILED=0
          for img in "${IMAGES[@]}"; do
            if docker push "${{ env.AR_REPO }}/${img}:${{ env.SHA }}"; then
              echo "  PUSHED: ${img}:${{ env.SHA }}"
              PASSED=$((PASSED + 1))
            else
              echo "  FAIL: ${img}"
              FAILED=$((FAILED + 1))
            fi
          done
          echo ""
          echo "Pushed: $PASSED / $((PASSED + FAILED))"
          if [ $FAILED -gt 0 ]; then
            echo "PUSH FAILED"
            exit 1
          fi

      - name: Capture image digests
        run: |
          IMAGES=(
            api-gateway main-backend
            retailer-admin supplier-portal superadmin landing
          )
          echo "IMAGE DIGESTS — SHA: ${{ env.SHA }}" > /tmp/digests.txt
          echo "---" >> /tmp/digests.txt
          for img in "${IMAGES[@]}"; do
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
              "${{ env.AR_REPO }}/${img}:${{ env.SHA }}" 2>/dev/null || echo "N/A")
            echo "${img}: ${DIGEST}" >> /tmp/digests.txt
          done
          cat /tmp/digests.txt

      - name: Upload digests artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ env.SHA }}
          path: /tmp/digests.txt
          retention-days: 90

  # ==========================================================================
  # STAGE-001: Pre-deploy safety gate — Cloud SQL backup + migration check
  # ==========================================================================
  pre-deploy-safety:
    name: Pre-Deploy Safety (Backup + Migration Check)
    needs: [gate, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # STAGE-001 + STAGE-014: Create Cloud SQL backup before any deploy
      # Non-blocking: automated daily backups are enabled (INFRA-019).
      # If WIF SA lacks cloudsql.admin, log warning and continue.
      # Operator action: grant roles/cloudsql.admin to WIF SA for CI-triggered backups.
      - name: Create pre-deploy Cloud SQL backup
        run: |
          echo "Creating pre-deploy backup of supermandi-staging..."
          if gcloud sql backups create \
            --instance=supermandi-staging \
            --project=${{ env.GCP_PROJECT }} \
            --description="pre-deploy-${{ needs.gate.outputs.sha_short }}-$(date +%Y%m%d-%H%M%S)" \
            2>/dev/null; then
            # Verify backup was created
            LATEST=$(gcloud sql backups list \
              --instance=supermandi-staging \
              --project=${{ env.GCP_PROJECT }} \
              --limit=1 \
              --format="value(id)" 2>/dev/null || echo "")
            echo "Latest backup ID: $LATEST"
            if [ -n "$LATEST" ]; then
              echo "PASS: Pre-deploy backup created (ID: $LATEST)"
            else
              echo "WARN: Backup command succeeded but could not verify. Continuing (daily backups are enabled)."
            fi
          else
            echo "WARN: Could not create pre-deploy backup (WIF SA may lack cloudsql.admin role)."
            echo "  Automated daily backups are enabled (INFRA-019). Continuing deploy."
            echo "  To fix: grant roles/cloudsql.admin to the WIF service account."
          fi

      # STAGE-001: Count expected migration files vs what we know
      - name: Count migration files in repo
        id: migration-count
        run: |
          EXPECTED=$(ls -1 backend/migrations/*.sql 2>/dev/null | wc -l)
          echo "expected_count=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "Migration files in repo: $EXPECTED"

  # ==========================================================================
  # Deploy to staging Cloud Run
  # ==========================================================================
  deploy-staging:
    name: Deploy Staging
    needs: [gate, build-push, pre-deploy-safety]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      pre_revisions: ${{ steps.pre-revisions.outputs.pre_revisions }}
    env:
      SHA: ${{ needs.gate.outputs.sha_short }}
      APP_VERSION: ${{ needs.gate.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # ISSUE-MICRO-038: Verify all images exist in AR before deploying
      - name: Verify image digests in Artifact Registry
        run: |
          echo "Verifying all 6 images exist in AR before deploy..."
          IMAGES=(
            api-gateway main-backend
            retailer-admin supplier-portal superadmin landing
          )
          FAILED=0
          for img in "${IMAGES[@]}"; do
            FULL_IMAGE="${{ env.AR_REPO }}/${img}:${{ env.SHA }}"
            DIGEST=$(gcloud artifacts docker images describe "$FULL_IMAGE" \
              --format="value(image_summary.digest)" 2>/dev/null || echo "")
            if [ -z "$DIGEST" ]; then
              echo "FAIL: $FULL_IMAGE not found in Artifact Registry"
              FAILED=$((FAILED + 1))
            else
              echo "OK: ${img}:${{ env.SHA }} → ${DIGEST}"
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "BLOCKED: $FAILED images missing from AR. Cannot deploy."
            exit 1
          fi
          echo "All 6 images verified in Artifact Registry."

      # STAGE-007: Record current serving revisions BEFORE deploy (for rollback)
      - name: Record pre-deploy revisions
        id: pre-revisions
        run: |
          SERVICES=(api-gateway main-backend retailer-admin supplier-portal superadmin landing)
          REVISIONS=""
          for svc in "${SERVICES[@]}"; do
            REV=$(gcloud run services describe "$svc" \
              --region="${{ env.GCP_REGION }}" \
              --format="value(status.traffic[0].revisionName)" 2>/dev/null || echo "none")
            echo "  $svc: $REV"
            REVISIONS="${REVISIONS}${svc}=${REV},"
          done
          echo "pre_revisions=$REVISIONS" >> "$GITHUB_OUTPUT"
          echo "Pre-deploy revisions recorded."

      # INFRA-010: Service names match existing GCP Cloud Run services (no prefix/suffix).
      # Existing services: api-gateway, main-backend, retailer-admin, supplier-portal, superadmin, landing
      # Load balancer NEGs point to these exact names.
      - name: Deploy main-backend to staging
        id: deploy-main-backend
        run: |
          VPC_CONNECTOR="projects/${{ env.GCP_PROJECT }}/locations/${{ env.GCP_REGION }}/connectors/supermandi-connector"
          SERVICE_NAME="main-backend"
          IMAGE="${{ env.AR_REPO }}/main-backend:${{ env.SHA }}"
          echo "--- Deploying: $SERVICE_NAME"
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --region="${{ env.GCP_REGION }}" \
            --platform=managed \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --vpc-connector="$VPC_CONNECTOR" \
            --vpc-egress=private-ranges-only \
            --add-cloudsql-instances="${{ env.GCP_PROJECT }}:${{ env.GCP_REGION }}:supermandi-staging" \
            --set-env-vars="\
          NODE_ENV=staging,\
          GIT_SHA=${{ env.SHA }},\
          MIN_APP_VERSION=${{ env.APP_VERSION }},\
          DB_HOST=/cloudsql/${{ env.GCP_PROJECT }}:${{ env.GCP_REGION }}:supermandi-staging,\
          DB_PORT=5432,\
          DB_NAME=supermandi,\
          DB_USER=postgres,\
          REDIS_HOST=10.107.71.27,\
          REDIS_PORT=6379,\
          REDIS_URL=redis://10.107.71.27:6379,\
          FIREBASE_ENABLED=true,\
          FIREBASE_PROJECT_ID=supermandi-pos,\
          SMS_DISABLED=true,\
          RATE_LIMIT_MULTIPLIER=100,\
          SMTP_HOST=smtp.gmail.com,\
          SMTP_PORT=587,\
          SMTP_USER=supermanditech@gmail.com,\
          EMAIL_FROM=SuperMandi <supermanditech@gmail.com>,\
          PORTAL_BASE_URL=https://staging.supermandi.tech,\
          POS_APP_DOWNLOAD_URL=https://staging.supermandi.tech/pos,\
          ADMIN_EMAIL_ALLOWLIST=supermanditech@gmail.com,\
          ALLOWED_ORIGINS=https://staging.supermandi.tech,\
          CORS_ALLOWED_ORIGINS=https://staging.supermandi.tech,\
          DOCUMENT_STORAGE_DIR=/tmp/documents" \
            --set-secrets="DATABASE_URL=database-url:latest,DB_PASSWORD=postgres-password:latest,JWT_SECRET=jwt-secret:latest,ADMIN_TOKEN=admin-token:latest,SMTP_PASS=smtp-password:latest" \
            --allow-unauthenticated \
            --quiet
          echo "    OK: $SERVICE_NAME"

          # Capture main-backend URL for api-gateway config
          MB_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region="${{ env.GCP_REGION }}" \
            --format="value(status.url)")
          echo "main_backend_url=$MB_URL" >> "$GITHUB_OUTPUT"
          echo "  main-backend URL: $MB_URL"

      - name: Deploy api-gateway to staging
        run: |
          VPC_CONNECTOR="projects/${{ env.GCP_PROJECT }}/locations/${{ env.GCP_REGION }}/connectors/supermandi-connector"
          SERVICE_NAME="api-gateway"
          IMAGE="${{ env.AR_REPO }}/api-gateway:${{ env.SHA }}"
          MB_URL="${{ steps.deploy-main-backend.outputs.main_backend_url }}"
          echo "--- Deploying: $SERVICE_NAME"
          echo "    ADMIN_SERVICE_URL=$MB_URL"
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --region="${{ env.GCP_REGION }}" \
            --platform=managed \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --vpc-connector="$VPC_CONNECTOR" \
            --vpc-egress=private-ranges-only \
            --set-env-vars="\
          NODE_ENV=staging,\
          GIT_SHA=${{ env.SHA }},\
          MIN_APP_VERSION=${{ env.APP_VERSION }},\
          ADMIN_SERVICE_URL=$MB_URL,\
          CORS_ALLOWED_ORIGINS=https://staging.supermandi.tech" \
            --set-secrets="JWT_SECRET=jwt-secret:latest,ADMIN_TOKEN=admin-token:latest" \
            --allow-unauthenticated \
            --quiet
          echo "    OK: $SERVICE_NAME"

      # STAGE-002: Portal deploy failure = pipeline failure (no silent swallow)
      - name: Deploy frontend portals to staging
        run: |
          PORTALS=(retailer-admin supplier-portal superadmin landing)
          FAILED=0
          for portal in "${PORTALS[@]}"; do
            SERVICE_NAME="${portal}"
            IMAGE="${{ env.AR_REPO }}/${portal}:${{ env.SHA }}"
            echo "--- Deploying: $SERVICE_NAME"
            if ! gcloud run deploy "$SERVICE_NAME" \
              --image="$IMAGE" \
              --region="${{ env.GCP_REGION }}" \
              --platform=managed \
              --memory=256Mi \
              --cpu=1 \
              --min-instances=0 \
              --max-instances=3 \
              --set-env-vars="GIT_SHA=${{ env.SHA }}" \
              --allow-unauthenticated \
              --quiet; then
              echo "FATAL: $portal deploy FAILED"
              FAILED=$((FAILED + 1))
            else
              echo "    OK: $SERVICE_NAME"
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "BLOCKED: $FAILED portal(s) failed to deploy. Pipeline cannot continue."
            exit 1
          fi
          echo "All 4 portals deployed successfully."

  # ==========================================================================
  # STAGE-017: Hardened smoke tests — every check has retries, timeouts,
  # body validation, and explicit BLOCKING behavior. No silent WARNs.
  # Learned from 3 pipeline failures: cold-start, redirects, SHA lag.
  # ==========================================================================
  smoke-test:
    name: Staging Smoke Test
    needs: [gate, deploy-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ needs.gate.outputs.sha_short }}
      CURL_TIMEOUT: 15
      RETRY_DELAY: 10
    steps:
      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Resolve service URLs
        id: url
        run: |
          SERVICES=(api-gateway main-backend retailer-admin supplier-portal superadmin landing)
          ALL_OK=true
          for svc in "${SERVICES[@]}"; do
            URL=$(gcloud run services describe "$svc" \
              --region="${{ env.GCP_REGION }}" \
              --format="value(status.url)" 2>/dev/null || echo "")
            # Normalize key: api-gateway → gateway, main-backend → backend, etc.
            KEY=$(echo "$svc" | tr '-' '_')
            echo "${KEY}_url=$URL" >> "$GITHUB_OUTPUT"
            if [ -z "$URL" ]; then
              echo "WARN: $svc — no URL resolved"
              ALL_OK=false
            else
              echo "OK: $svc → $URL"
            fi
          done
          if [ "$ALL_OK" = "false" ]; then
            echo "WARNING: Some service URLs could not be resolved (new services may not exist yet)"
          fi

      # ---- Gate 1: api-gateway health (5 retries, body validated) ----
      - name: "Gate 1: api-gateway health (BLOCKING)"
        if: steps.url.outputs.api_gateway_url != ''
        run: |
          URL="${{ steps.url.outputs.api_gateway_url }}"
          echo "Checking api-gateway health at $URL/health ..."
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -sf --max-time ${{ env.CURL_TIMEOUT }} "$URL/health" 2>/dev/null || echo "")
            echo "  Attempt $attempt: $BODY"
            if echo "$BODY" | grep -q '"status":"ok"'; then
              echo "PASS: api-gateway health OK (body validated)"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "  Retrying in ${{ env.RETRY_DELAY }}s..."
              sleep ${{ env.RETRY_DELAY }}
            fi
          done
          echo "FATAL: api-gateway /health did not return {\"status\":\"ok\"} after 5 attempts"
          echo "  Last response: $BODY"
          exit 1

      # ---- Gate 2: main-backend health (independent check, 5 retries) ----
      - name: "Gate 2: main-backend health (BLOCKING)"
        if: steps.url.outputs.main_backend_url != ''
        run: |
          URL="${{ steps.url.outputs.main_backend_url }}"
          echo "Checking main-backend health at $URL/health ..."
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -sf --max-time ${{ env.CURL_TIMEOUT }} "$URL/health" 2>/dev/null || echo "")
            echo "  Attempt $attempt: $BODY"
            if echo "$BODY" | grep -q '"status":"ok"'; then
              echo "PASS: main-backend health OK (body validated)"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "  Retrying in ${{ env.RETRY_DELAY }}s..."
              sleep ${{ env.RETRY_DELAY }}
            fi
          done
          echo "FATAL: main-backend /health did not return {\"status\":\"ok\"} after 5 attempts"
          echo "  Last response: $BODY"
          exit 1

      # ---- Gate 3: Version SHA — api-gateway (5 retries) ----
      - name: "Gate 3: api-gateway version SHA (BLOCKING)"
        if: steps.url.outputs.api_gateway_url != ''
        run: |
          URL="${{ steps.url.outputs.api_gateway_url }}"
          EXPECTED="${{ env.SHA }}"
          echo "Checking api-gateway version at $URL/version (expecting $EXPECTED)..."
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -sf --max-time ${{ env.CURL_TIMEOUT }} "$URL/version" 2>/dev/null || echo "{}")
            echo "  Attempt $attempt: $BODY"
            if echo "$BODY" | grep -q "$EXPECTED"; then
              echo "PASS: api-gateway SHA matches ($EXPECTED)"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "  SHA not yet matching (cold-start lag). Retrying in ${{ env.RETRY_DELAY }}s..."
              sleep ${{ env.RETRY_DELAY }}
            fi
          done
          echo "FATAL: api-gateway /version SHA mismatch after 5 attempts"
          echo "  Expected: $EXPECTED"
          echo "  Last response: $BODY"
          exit 1

      # ---- Gate 4: Version SHA — main-backend (5 retries) ----
      - name: "Gate 4: main-backend version SHA (BLOCKING)"
        if: steps.url.outputs.main_backend_url != ''
        run: |
          URL="${{ steps.url.outputs.main_backend_url }}"
          EXPECTED="${{ env.SHA }}"
          echo "Checking main-backend version at $URL/version (expecting $EXPECTED)..."
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -sf --max-time ${{ env.CURL_TIMEOUT }} "$URL/version" 2>/dev/null || echo "{}")
            echo "  Attempt $attempt: $BODY"
            if echo "$BODY" | grep -q "$EXPECTED"; then
              echo "PASS: main-backend SHA matches ($EXPECTED)"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "  SHA not yet matching (cold-start lag). Retrying in ${{ env.RETRY_DELAY }}s..."
              sleep ${{ env.RETRY_DELAY }}
            fi
          done
          echo "FATAL: main-backend /version SHA mismatch after 5 attempts"
          echo "  Expected: $EXPECTED"
          echo "  Last response: $BODY"
          exit 1

      # ---- Gate 5: Portal health checks (3 retries each, follows redirects) ----
      - name: "Gate 5: Portal health checks (BLOCKING)"
        run: |
          PORTALS=(retailer-admin supplier-portal superadmin landing)
          MAX_RETRIES=3
          FAILED=0
          for portal in "${PORTALS[@]}"; do
            URL=""
            case "$portal" in
              retailer-admin)   URL="${{ steps.url.outputs.retailer_admin_url }}" ;;
              supplier-portal)  URL="${{ steps.url.outputs.supplier_portal_url }}" ;;
              superadmin)       URL="${{ steps.url.outputs.superadmin_url }}" ;;
              landing)          URL="${{ steps.url.outputs.landing_url }}" ;;
            esac
            if [ -z "$URL" ]; then
              echo "FAIL: $portal — no URL resolved"
              FAILED=$((FAILED + 1))
              continue
            fi
            PORTAL_PASS=false
            for attempt in $(seq 1 $MAX_RETRIES); do
              # -L follows redirects (SPAs redirect / to base path like /retailer/)
              STATUS=$(curl -sL --max-time ${{ env.CURL_TIMEOUT }} -o /dev/null -w "%{http_code}" "$URL/" 2>/dev/null || echo "000")
              echo "  $portal attempt $attempt: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "  PASS: $portal — HTTP 200"
                PORTAL_PASS=true
                break
              fi
              if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                echo "  Retrying in ${{ env.RETRY_DELAY }}s (cold-start)..."
                sleep ${{ env.RETRY_DELAY }}
              fi
            done
            if [ "$PORTAL_PASS" = "false" ]; then
              echo "  FAIL: $portal — HTTP $STATUS after $MAX_RETRIES attempts"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "FATAL: $FAILED portal(s) failed smoke test after retries"
            exit 1
          fi
          echo "PASS: All 4 portals healthy (with redirect handling + retries)"

      # ---- Gate 6: Auth guard (3 retries, ALL unexpected statuses block) ----
      - name: "Gate 6: Auth guard (BLOCKING)"
        if: steps.url.outputs.api_gateway_url != ''
        run: |
          URL="${{ steps.url.outputs.api_gateway_url }}"
          echo "Checking auth guard at $URL/api/v1/admin/stores (no token)..."
          for attempt in 1 2 3; do
            STATUS=$(curl -s --max-time ${{ env.CURL_TIMEOUT }} -o /dev/null -w "%{http_code}" "$URL/api/v1/admin/stores" 2>/dev/null || echo "000")
            echo "  Attempt $attempt: HTTP $STATUS"
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
              echo "PASS: Auth guard working — unauthenticated request rejected ($STATUS)"
              exit 0
            elif [ "$STATUS" = "200" ]; then
              echo "FATAL: /api/v1/admin/stores returned 200 WITHOUT authentication"
              echo "BLOCKED: Auth guard is not functioning — security breach risk"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "  Unexpected status. Retrying in ${{ env.RETRY_DELAY }}s (cold-start)..."
              sleep ${{ env.RETRY_DELAY }}
            fi
          done
          echo "FATAL: Auth guard returned unexpected HTTP $STATUS after 3 attempts"
          echo "  Expected: 401 or 403. Got: $STATUS"
          echo "  This means the gateway is not routing to the backend correctly."
          exit 1

      # ---- Gate 7: API gateway → main-backend connectivity (BLOCKING) ----
      - name: "Gate 7: Gateway-to-backend connectivity (BLOCKING)"
        if: steps.url.outputs.api_gateway_url != ''
        run: |
          URL="${{ steps.url.outputs.api_gateway_url }}"
          echo "Verifying api-gateway can proxy to main-backend..."
          # Hit a known API route through the gateway. Even without auth, we should get
          # 401/403 (auth middleware) — NOT 502/503/504 (backend unreachable).
          for attempt in 1 2 3; do
            STATUS=$(curl -s --max-time ${{ env.CURL_TIMEOUT }} -o /dev/null -w "%{http_code}" "$URL/api/v1/pos/health" 2>/dev/null || echo "000")
            echo "  Attempt $attempt: HTTP $STATUS"
            # Any response from the backend is good (401, 403, 404, 200 all mean connectivity works)
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "PASS: Gateway successfully proxied to main-backend (HTTP $STATUS)"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "  Backend may still be starting. Retrying in ${{ env.RETRY_DELAY }}s..."
              sleep ${{ env.RETRY_DELAY }}
            fi
          done
          echo "FATAL: api-gateway cannot reach main-backend (HTTP $STATUS after 3 attempts)"
          echo "  Expected: any 2xx/3xx/4xx from backend. Got: $STATUS (server error / unreachable)"
          echo "  Check: ADMIN_SERVICE_URL env var, VPC connector, main-backend health"
          exit 1

      # STAGE-007: Auto-rollback all services if ANY smoke test fails
      - name: Auto-rollback on failure
        if: failure()
        run: |
          echo "SMOKE TEST FAILED — Rolling back all services to previous revisions..."
          PRE_REVISIONS="${{ needs.deploy-staging.outputs.pre_revisions }}"
          if [ -z "$PRE_REVISIONS" ]; then
            echo "WARN: No pre-deploy revisions recorded. Manual rollback required."
            echo "  Use: gcloud run services update-traffic <SERVICE> --to-revisions=<REVISION>=100 --region=${{ env.GCP_REGION }}"
            exit 1
          fi
          # Parse "svc=rev," format and rollback each
          IFS=',' read -ra PAIRS <<< "$PRE_REVISIONS"
          ROLLBACK_FAILED=0
          for pair in "${PAIRS[@]}"; do
            [ -z "$pair" ] && continue
            SVC="${pair%%=*}"
            REV="${pair##*=}"
            if [ "$REV" = "none" ] || [ -z "$REV" ]; then
              echo "  SKIP: $SVC (no previous revision)"
              continue
            fi
            echo "  Rolling back $SVC → $REV"
            if gcloud run services update-traffic "$SVC" \
              --to-revisions="$REV=100" \
              --region="${{ env.GCP_REGION }}" \
              --quiet 2>/dev/null; then
              echo "  OK: $SVC rolled back"
            else
              echo "  FAIL: Could not rollback $SVC"
              ROLLBACK_FAILED=$((ROLLBACK_FAILED + 1))
            fi
          done
          if [ $ROLLBACK_FAILED -gt 0 ]; then
            echo "WARNING: $ROLLBACK_FAILED service(s) could not be rolled back"
          else
            echo "All services rolled back to pre-deploy revisions."
          fi
          # Still fail the pipeline
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Staging Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA:** ${{ env.SHA }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Gateway:** ${{ steps.url.outputs.api_gateway_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "Next: Operator tests staging, then runs \`./scripts/promote-to-prod.sh ${{ env.SHA }} --confirm\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**FAILED**: Smoke tests failed. Auto-rollback attempted. Check logs above." >> "$GITHUB_STEP_SUMMARY"
          fi

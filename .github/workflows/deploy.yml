# CD-WORKFLOW-001: Build images → Push to AR → Auto-deploy staging Cloud Run
# Triggers after CI gates pass on push to main.
# Production deploy is MANUAL via promote-to-prod.sh (CD-201 enforced).

name: CD — Build & Deploy Staging

on:
  workflow_run:
    workflows: ["CI Gates (Zero-Regression)"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA to deploy (default: HEAD)'
        required: false
        type: string

env:
  GCP_PROJECT: supermandi-backend
  GCP_REGION: asia-south1
  AR_REPO: asia-south1-docker.pkg.dev/supermandi-backend/supermandi

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Gate: Only deploy if CI passed
  # ==========================================================================
  gate:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      sha_short: ${{ steps.sha.outputs.sha_short }}
      app_version: ${{ steps.appver.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enforce artifact phase lock
        run: node scripts/enforce-artifact-phase-lock.js --mode=deploy

      - name: Determine SHA
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "Deploying SHA: $SHA_SHORT ($SHA)"

      # SA-P2-003-AUTO: Extract POS app version for min-version enforcement
      - name: Extract app version
        id: appver
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $APP_VERSION"

  # ==========================================================================
  # Build all 6 Docker images and push to Artifact Registry
  # (2 backend: api-gateway + main-backend, 4 frontends)
  # ==========================================================================
  build-push:
    name: Build & Push Images
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for WIF
    env:
      SHA: ${{ needs.gate.outputs.sha_short }}
      BUILD_TIME: ${{ github.event.workflow_run.head_commit.timestamp || github.event.workflow_run.created_at }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Configure Docker for AR
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set build time
        run: echo "BUILD_TIME=$(date -Iseconds)" >> "$GITHUB_ENV"

      # --- Backend services (2 images: api-gateway + main-backend) ---
      - name: Build api-gateway
        run: |
          echo "--- Building: api-gateway"
          docker build \
            -t "${{ env.AR_REPO }}/api-gateway:${{ env.SHA }}" \
            -f "backend/services/api-gateway/Dockerfile" \
            --build-arg GIT_SHA="${{ env.SHA }}" \
            --build-arg BUILD_TIME="${{ env.BUILD_TIME }}" \
            backend/
          echo "    OK: api-gateway"

      - name: Build main-backend
        run: |
          echo "--- Building: main-backend"
          docker build \
            -t "${{ env.AR_REPO }}/main-backend:${{ env.SHA }}" \
            -f "backend/Dockerfile.main" \
            --build-arg GIT_SHA="${{ env.SHA }}" \
            --build-arg BUILD_TIME="${{ env.BUILD_TIME }}" \
            backend/
          echo "    OK: main-backend"

      # --- Frontend portals (4 images) ---
      # STAGING-FIREBASE-001: Firebase config injected at build time for phone OTP
      - name: Build retailer-admin
        run: |
          # STAGING-FIX-007: Firebase config loaded from .env.production at build time (not Docker ARGs)
          # Firebase build-args removed — Dockerfiles load from .env.production files, not ARGs
          docker build \
            -t "${{ env.AR_REPO }}/retailer-admin:${{ env.SHA }}" \
            -f retailer-admin/Dockerfile \
            --build-arg VITE_API_BASE_URL="" \
            --build-arg VITE_GIT_SHA="${{ env.SHA }}" \
            --build-arg VITE_BUILD_TIME="${{ env.BUILD_TIME }}" \
            retailer-admin/

      - name: Build supplier-portal
        run: |
          # STAGING-FIX-007: Firebase config loaded from .env.production at build time (not Docker ARGs)
          docker build \
            -t "${{ env.AR_REPO }}/supplier-portal:${{ env.SHA }}" \
            -f supplier-portal/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL="" \
            --build-arg NEXT_PUBLIC_GIT_SHA="${{ env.SHA }}" \
            --build-arg NEXT_PUBLIC_BUILD_TIME="${{ env.BUILD_TIME }}" \
            supplier-portal/

      - name: Build superadmin
        run: |
          # Superadmin does not use Firebase — no Firebase build-args needed
          docker build \
            -t "${{ env.AR_REPO }}/superadmin:${{ env.SHA }}" \
            -f supermandi-superadmin/Dockerfile \
            --build-arg VITE_API_BASE_URL="" \
            --build-arg VITE_GIT_SHA="${{ env.SHA }}" \
            --build-arg VITE_BUILD_TIME="${{ env.BUILD_TIME }}" \
            supermandi-superadmin/

      - name: Build landing
        run: |
          docker build \
            -t "${{ env.AR_REPO }}/landing:${{ env.SHA }}" \
            -f supermandi-landing/Dockerfile \
            supermandi-landing/

      # --- Push all 6 images ---
      - name: Push all images to AR
        run: |
          IMAGES=(
            api-gateway main-backend
            retailer-admin supplier-portal superadmin landing
          )
          PASSED=0
          FAILED=0
          for img in "${IMAGES[@]}"; do
            if docker push "${{ env.AR_REPO }}/${img}:${{ env.SHA }}"; then
              echo "  PUSHED: ${img}:${{ env.SHA }}"
              PASSED=$((PASSED + 1))
            else
              echo "  FAIL: ${img}"
              FAILED=$((FAILED + 1))
            fi
          done
          echo ""
          echo "Pushed: $PASSED / $((PASSED + FAILED))"
          if [ $FAILED -gt 0 ]; then
            echo "PUSH FAILED"
            exit 1
          fi

      - name: Capture image digests
        run: |
          IMAGES=(
            api-gateway main-backend
            retailer-admin supplier-portal superadmin landing
          )
          echo "IMAGE DIGESTS — SHA: ${{ env.SHA }}" > /tmp/digests.txt
          echo "---" >> /tmp/digests.txt
          for img in "${IMAGES[@]}"; do
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
              "${{ env.AR_REPO }}/${img}:${{ env.SHA }}" 2>/dev/null || echo "N/A")
            echo "${img}: ${DIGEST}" >> /tmp/digests.txt
          done
          cat /tmp/digests.txt

      - name: Upload digests artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ env.SHA }}
          path: /tmp/digests.txt
          retention-days: 90

  # ==========================================================================
  # STAGE-001: Pre-deploy safety gate — Cloud SQL backup + migration check
  # ==========================================================================
  pre-deploy-safety:
    name: Pre-Deploy Safety (Backup + Migration Check)
    needs: [gate, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # V3-HARDEN-104: Production audit gate — blocking pre-deploy check
      # DEPLOY_TIER=staging: payment/WhatsApp secrets are warnings (degrade gracefully)
      - name: Production Audit Gate
        run: bash scripts/gates/production-audit-gate.sh
        env:
          DEPLOY_TIER: staging
          GCS_DOCUMENTS_BUCKET: ${{ secrets.GCS_DOCUMENTS_BUCKET != '' && secrets.GCS_DOCUMENTS_BUCKET || 'supermandi-pos-documents' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || 'configured-via-secret-manager' }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          PHONEPE_MERCHANT_ID: ${{ secrets.PHONEPE_MERCHANT_ID }}
          PHONEPE_SALT_KEY: ${{ secrets.PHONEPE_SALT_KEY }}
          PHONEPE_SALT_INDEX: ${{ secrets.PHONEPE_SALT_INDEX }}
          PHONEPE_ENV: ${{ secrets.PHONEPE_ENV }}
          PINE_LABS_MERCHANT_ID: ${{ secrets.PINE_LABS_MERCHANT_ID }}
          PINE_LABS_ACCESS_CODE: ${{ secrets.PINE_LABS_ACCESS_CODE }}
          PINE_LABS_SECRET: ${{ secrets.PINE_LABS_SECRET }}
          SUPERMANDI_UPI_VPA: ${{ secrets.SUPERMANDI_UPI_VPA }}
          PAYMENT_CALLBACK_URL: ${{ secrets.PAYMENT_CALLBACK_URL }}
          DEFAULT_UPI_VPA: ${{ secrets.DEFAULT_UPI_VPA }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_BUSINESS_PHONE_ID: ${{ secrets.WHATSAPP_BUSINESS_PHONE_ID }}

      # V3-HARDEN-118: Auth rollout gate — verifies OTP auth is deployed
      - name: Auth Rollout Gate
        run: bash scripts/gates/auth-rollout-gate.sh
        env:
          STAGING_URL: https://staging.supermandi.tech
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # V3-HARDEN-119: Version parity check — reports app/backend SHA alignment
      - name: Version Parity Check
        run: bash scripts/gates/version-parity-check.sh
        env:
          STAGING_URL: https://staging.supermandi.tech
          APP_BUILD_SHA: ${{ needs.gate.outputs.sha_short }}

      # V3-HARDEN-148: Principal procurement gate — checks procurement lane infrastructure
      - name: Principal Procurement Gate
        run: bash scripts/gates/principal-procurement-gate.sh
        env:
          STAGING_URL: https://staging.supermandi.tech

      # V3-HARDEN-105: Scale acceptance gate — blocking index + throughput verification
      - name: Scale Acceptance Gate
        run: bash scripts/gates/scale-acceptance.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # V3-HARDEN-153: Scale capacity gate for 10k-SKU/5k-supplier/1000-supplier targets
      - name: Scale Capacity Gate
        run: bash scripts/gates/scale-capacity-gate.sh
        env:
          STAGING_URL: https://staging.supermandi.tech

      # V3-HARDEN-161: Scan capacity gate — 50k+50k/day scan infrastructure
      - name: Scan Capacity Gate
        run: bash scripts/gates/scan-capacity-gate.sh

      # V3-HARDEN-166: Demand signal & allocation gate
      - name: Demand Signal Gate
        run: bash scripts/gates/demand-signal-gate.sh

      # V3-HARDEN-189: Phase 21 go-live gate (blocking)
      - name: Phase 21 Go-Live Gate
        run: bash scripts/gates/phase21-go-live-gate.sh

      # STAGE-001 + STAGE-014: Create Cloud SQL backup before any deploy
      # Non-blocking: automated daily backups are enabled (INFRA-019).
      # If WIF SA lacks cloudsql.admin, log warning and continue.
      # Operator action: grant roles/cloudsql.admin to WIF SA for CI-triggered backups.
      - name: Create pre-deploy Cloud SQL backup
        run: |
          echo "Creating pre-deploy backup of supermandi-staging..."
          if gcloud sql backups create \
            --instance=supermandi-staging \
            --project=${{ env.GCP_PROJECT }} \
            --description="pre-deploy-${{ needs.gate.outputs.sha_short }}-$(date +%Y%m%d-%H%M%S)" \
            2>/dev/null; then
            # Verify backup was created
            LATEST=$(gcloud sql backups list \
              --instance=supermandi-staging \
              --project=${{ env.GCP_PROJECT }} \
              --limit=1 \
              --format="value(id)" 2>/dev/null || echo "")
            echo "Latest backup ID: $LATEST"
            if [ -n "$LATEST" ]; then
              echo "PASS: Pre-deploy backup created (ID: $LATEST)"
            else
              echo "WARN: Backup command succeeded but could not verify. Continuing (daily backups are enabled)."
            fi
          else
            echo "WARN: Could not create pre-deploy backup (WIF SA may lack cloudsql.admin role)."
            echo "  Automated daily backups are enabled (INFRA-019). Continuing deploy."
            echo "  To fix: grant roles/cloudsql.admin to the WIF service account."
          fi

      # STAGE-001: Count expected migration files vs what we know
      - name: Count migration files in repo
        id: migration-count
        run: |
          EXPECTED=$(ls -1 backend/migrations/*.sql 2>/dev/null | wc -l)
          echo "expected_count=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "Migration files in repo: $EXPECTED"

      # ZRP-D-003: Secret freshness check — verify all secrets exist and are accessible
      # Requires roles/secretmanager.viewer on WIF SA (granted 2026-02-14)
      - name: "ZRP-D-003: Secret freshness check (BLOCKING)"
        run: |
          echo "=== ZRP-D-003: Secret Freshness Check ==="
          SECRETS=(database-url postgres-password jwt-secret admin-token smtp-password WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_VERIFY_TOKEN WHATSAPP_APP_SECRET)
          FAIL=0
          for secret in "${SECRETS[@]}"; do
            # Check secret exists and has an enabled version
            # Capture stderr to distinguish permission-denied from missing secret
            ERR_FILE=$(mktemp)
            VERSION=$(gcloud secrets versions list "$secret" \
              --project=${{ env.GCP_PROJECT }} \
              --filter="state=ENABLED" \
              --format="value(name)" \
              --limit=1 2>"$ERR_FILE" || true)
            ERR_MSG=$(cat "$ERR_FILE")
            rm -f "$ERR_FILE"
            if [ -n "$VERSION" ]; then
              echo "  OK: $secret (latest enabled version: $VERSION)"
            elif echo "$ERR_MSG" | grep -qi "permission"; then
              echo "  FAIL: $secret — permission denied (WIF SA needs roles/secretmanager.viewer)"
              FAIL=$((FAIL + 1))
            elif echo "$ERR_MSG" | grep -qi "NOT_FOUND\|not found"; then
              echo "  FAIL: $secret — secret does not exist in Secret Manager"
              FAIL=$((FAIL + 1))
            else
              echo "  FAIL: $secret — no enabled version found"
              if [ -n "$ERR_MSG" ]; then
                echo "    Error: $ERR_MSG"
              fi
              FAIL=$((FAIL + 1))
            fi
          done
          if [ $FAIL -gt 0 ]; then
            echo "BLOCKED: $FAIL secret(s) missing or disabled in Secret Manager."
            exit 1
          fi
          echo "PASS: All 9 secrets verified in Secret Manager."

      # ZRP-D-007: VPC connector verification — must be READY before deploy
      # Requires roles/vpcaccess.viewer on WIF SA (granted 2026-02-14)
      - name: "ZRP-D-007: VPC connector check (BLOCKING)"
        run: |
          echo "=== ZRP-D-007: VPC Connector Verification ==="
          ERR_FILE=$(mktemp)
          STATE=$(gcloud compute networks vpc-access connectors describe supermandi-connector \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --format="value(state)" 2>"$ERR_FILE" || true)
          ERR_MSG=$(cat "$ERR_FILE")
          rm -f "$ERR_FILE"
          if [ -n "$STATE" ] && [ "$STATE" = "READY" ]; then
            echo "  VPC connector state: READY"
            echo "PASS: VPC connector is READY."
          elif echo "$ERR_MSG" | grep -qi "permission"; then
            echo "  FAIL: Permission denied — WIF SA needs roles/vpcaccess.viewer"
            echo "  Error: $ERR_MSG"
            exit 1
          else
            echo "  VPC connector state: ${STATE:-NOT_FOUND}"
            if [ -n "$ERR_MSG" ]; then echo "  Error: $ERR_MSG"; fi
            echo "BLOCKED: VPC connector state is '${STATE:-NOT_FOUND}' (expected READY)."
            exit 1
          fi

      # ZRP-G-008: Cloud SQL instance must be RUNNABLE
      # Requires roles/cloudsql.viewer on WIF SA (granted 2026-02-14)
      - name: "ZRP-G-008: Cloud SQL connectivity check (BLOCKING)"
        run: |
          echo "=== ZRP-G-008: Cloud SQL Connectivity ==="
          ERR_FILE=$(mktemp)
          STATE=$(gcloud sql instances describe supermandi-staging \
            --project=${{ env.GCP_PROJECT }} \
            --format="value(state)" 2>"$ERR_FILE" || true)
          ERR_MSG=$(cat "$ERR_FILE")
          rm -f "$ERR_FILE"
          if [ -n "$STATE" ] && [ "$STATE" = "RUNNABLE" ]; then
            echo "  Cloud SQL instance state: RUNNABLE"
            echo "PASS: Cloud SQL instance is RUNNABLE."
          elif echo "$ERR_MSG" | grep -qi "permission"; then
            echo "  FAIL: Permission denied — WIF SA needs roles/cloudsql.viewer"
            echo "  Error: $ERR_MSG"
            exit 1
          else
            echo "  Cloud SQL instance state: ${STATE:-NOT_FOUND}"
            if [ -n "$ERR_MSG" ]; then echo "  Error: $ERR_MSG"; fi
            echo "BLOCKED: Cloud SQL instance state is '${STATE:-NOT_FOUND}' (expected RUNNABLE)."
            exit 1
          fi

      # ZRP-F-076/G-086/G-087: Cloud security posture (WARNING — non-blocking)
      - name: "ZRP: Cloud posture check (WARNING)"
        continue-on-error: true
        env:
          GCP_PROJECT: ${{ env.GCP_PROJECT }}
          GCP_REGION: ${{ env.GCP_REGION }}
        run: |
          chmod +x scripts/gates/cloud-posture.sh
          bash scripts/gates/cloud-posture.sh

  # ==========================================================================
  # Deploy to staging Cloud Run
  # ==========================================================================
  deploy-staging:
    name: Deploy Staging
    needs: [gate, build-push, pre-deploy-safety]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      pre_revisions: ${{ steps.pre-revisions.outputs.pre_revisions }}
    env:
      SHA: ${{ needs.gate.outputs.sha_short }}
      APP_VERSION: ${{ needs.gate.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # ISSUE-MICRO-038: Verify all images exist in AR before deploying
      # Uses gcloud artifacts docker tags list (more reliable than describe)
      - name: Verify image digests in Artifact Registry
        run: |
          echo "Verifying all 6 images exist in AR before deploy..."
          IMAGES=(
            api-gateway main-backend
            retailer-admin supplier-portal superadmin landing
          )
          FAILED=0
          for img in "${IMAGES[@]}"; do
            TAG_EXISTS=$(gcloud artifacts docker tags list \
              "${{ env.AR_REPO }}/${img}" \
              --filter="tag:${{ env.SHA }}" \
              --format="value(tag)" \
              --project="${{ env.GCP_PROJECT }}" 2>&1) || true
            if echo "$TAG_EXISTS" | grep -q "${{ env.SHA }}"; then
              echo "OK: ${img}:${{ env.SHA }}"
            else
              echo "FAIL: ${img}:${{ env.SHA }} — not found (output: $TAG_EXISTS)"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "BLOCKED: $FAILED images missing from AR. Cannot deploy."
            exit 1
          fi
          echo "All 6 images verified in Artifact Registry."

      # STAGE-020: GCP CLI Parity Gate — validate gcloud run deploy flags
      # BEFORE any deploy. Prevents pipeline failures from invalid flag syntax.
      # Learned from STAGE-018/019: gcloud CLI uses --cpu-boost (not --startup-cpu-boost)
      # and --startup-probe=KEY=VALUE (not individual --startup-probe-* flags).
      # Extracts flags from gcloud run deploy command blocks in deploy.yml,
      # then validates each against `gcloud run deploy --help`.
      - name: "GCP CLI parity gate (BLOCKING)"
        run: |
          echo "=== STAGE-020: GCP CLI Parity Gate ==="
          echo "Validating gcloud run deploy flags against installed gcloud CLI..."
          echo ""

          # Step 1: Build valid flag set from gcloud run deploy --help
          HELP_OUTPUT=$(gcloud run deploy --help 2>&1)
          VALID_FLAG_NAMES=$(echo "$HELP_OUTPUT" | grep -oE '\-\-[a-z][a-z0-9-]*' | sort -u)
          VALID_COUNT=$(echo "$VALID_FLAG_NAMES" | wc -l)
          echo "gcloud run deploy accepts $VALID_COUNT flags."

          # Step 2: Extract flags ONLY from gcloud run deploy command blocks.
          # These blocks start with 'gcloud run deploy' and end at a line without '\'.
          # Use awk to isolate these blocks, then extract --flag patterns.
          DEPLOY_FLAGS=$(awk '
            /gcloud run deploy/ { in_block=1 }
            in_block && /--[a-z]/ { print }
            in_block && !/\\$/ { in_block=0 }
          ' .github/workflows/deploy.yml \
            | grep -oE '\-\-[a-z][a-z0-9-]*' \
            | sort -u)

          echo ""
          echo "Flags used in gcloud run deploy blocks:"
          INVALID=0
          CHECKED=0
          for flag in $DEPLOY_FLAGS; do
            CHECKED=$((CHECKED + 1))
            if echo "$VALID_FLAG_NAMES" | grep -qxF -- "$flag"; then
              echo "  OK: $flag"
            else
              echo "  FAIL: $flag — NOT a valid gcloud run deploy flag"
              INVALID=$((INVALID + 1))
            fi
          done

          echo ""
          echo "Checked $CHECKED flags."
          if [ $INVALID -gt 0 ]; then
            echo "BLOCKED: $INVALID invalid gcloud run deploy flag(s) detected."
            echo "Fix deploy.yml before deploying. Reference: gcloud run deploy --help"
            exit 1
          fi
          echo "PASS: All $CHECKED gcloud run deploy flags are valid. GCP parity confirmed."
          echo ""

      # STAGE-022: Pre-deploy GCP state gate — comprehensive check BEFORE deploying.
      # Collects each service's current state (traffic revision, latest revision,
      # Active status) so we can detect issues early and have rollback context.
      - name: "Pre-deploy GCP state check"
        run: |
          echo "=== STAGE-022: Pre-Deploy GCP State ==="
          echo "Collecting current state of all 6 Cloud Run services..."
          echo ""
          SERVICES=(api-gateway main-backend retailer-admin supplier-portal superadmin landing)
          ISSUES=0
          for svc in "${SERVICES[@]}"; do
            STATE=$(gcloud run services describe "$svc" \
              --region="${{ env.GCP_REGION }}" \
              --format="json(status.traffic[0].revisionName,status.traffic[0].percent,status.latestCreatedRevisionName,status.latestReadyRevisionName)" 2>/dev/null || echo "{}")
            TRAFFIC_REV=$(echo "$STATE" | grep -oP '"revisionName":\s*"\K[^"]+' || echo "none")
            TRAFFIC_PCT=$(echo "$STATE" | grep -oP '"percent":\s*\K[0-9]+' || echo "0")
            LATEST_CREATED=$(echo "$STATE" | grep -oP '"latestCreatedRevisionName":\s*"\K[^"]+' || echo "none")
            LATEST_READY=$(echo "$STATE" | grep -oP '"latestReadyRevisionName":\s*"\K[^"]+' || echo "none")

            echo "  $svc:"
            echo "    Traffic: $TRAFFIC_REV ($TRAFFIC_PCT%)"
            echo "    Latest created: $LATEST_CREATED"
            echo "    Latest ready: $LATEST_READY"

            # Warn if latest created != traffic revision (stale revisions exist)
            if [ "$LATEST_CREATED" != "$TRAFFIC_REV" ]; then
              echo "    WARN: Latest created revision differs from traffic revision (stale revisions may exist)"
              ISSUES=$((ISSUES + 1))
            fi
          done
          echo ""
          if [ $ISSUES -gt 0 ]; then
            echo "INFO: $ISSUES service(s) have stale revisions from previous deploys."
            echo "Proceeding with deploy — new revision will replace them."
          else
            echo "All services in clean state."
          fi
          echo ""

      # STAGE-007: Record current serving revisions BEFORE deploy (for rollback)
      - name: Record pre-deploy revisions
        id: pre-revisions
        run: |
          SERVICES=(api-gateway main-backend retailer-admin supplier-portal superadmin landing)
          REVISIONS=""
          for svc in "${SERVICES[@]}"; do
            REV=$(gcloud run services describe "$svc" \
              --region="${{ env.GCP_REGION }}" \
              --format="value(status.traffic[0].revisionName)" 2>/dev/null || echo "none")
            echo "  $svc: $REV"
            REVISIONS="${REVISIONS}${svc}=${REV},"
          done
          echo "pre_revisions=$REVISIONS" >> "$GITHUB_OUTPUT"
          echo "Pre-deploy revisions recorded."

      # INFRA-010: Service names match existing GCP Cloud Run services (no prefix/suffix).
      # Existing services: api-gateway, main-backend, retailer-admin, supplier-portal, superadmin, landing
      # Load balancer NEGs point to these exact names.
      # STAGE-022: Removed --startup-probe and --cpu-boost (caused 0% traffic bug).
      # gcloud run deploy with startup probes exits 0 before probe completes,
      # leaving new revision with 0% traffic. Probes are "sticky" on Cloud Run
      # services — must explicitly clear with --startup-probe="" to remove
      # the probe set by STAGE-018. Without a probe, gcloud routes traffic
      # immediately and --deploy-health-check (default) uses TCP readiness.
      - name: Deploy main-backend to staging
        id: deploy-main-backend
        run: |
          VPC_CONNECTOR="projects/${{ env.GCP_PROJECT }}/locations/${{ env.GCP_REGION }}/connectors/supermandi-connector"
          SERVICE_NAME="main-backend"
          IMAGE="${{ env.AR_REPO }}/main-backend:${{ env.SHA }}"
          echo "--- Deploying: $SERVICE_NAME"
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --region="${{ env.GCP_REGION }}" \
            --service-account=cloudrun-backend@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            --ingress=internal-and-cloud-load-balancing \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=3 \
            --startup-probe="" \
            --vpc-connector="$VPC_CONNECTOR" \
            --vpc-egress=private-ranges-only \
            --add-cloudsql-instances="${{ env.GCP_PROJECT }}:${{ env.GCP_REGION }}:supermandi-staging" \
            --set-env-vars="^;^NODE_ENV=staging;GIT_SHA=${{ env.SHA }};MIN_APP_VERSION=${{ env.APP_VERSION }};DB_HOST=/cloudsql/${{ env.GCP_PROJECT }}:${{ env.GCP_REGION }}:supermandi-staging;DB_PORT=5432;DB_NAME=supermandi;DB_USER=postgres;DB_SSL=false;REDIS_HOST=10.107.71.27;REDIS_PORT=6379;REDIS_URL=redis://10.107.71.27:6379;FIREBASE_ENABLED=true;FIREBASE_PROJECT_ID=supermandi-pos;SMS_DISABLED=true;SUPPLIER_PORTAL_URL=https://staging.supermandi.tech/supplier;RETAILER_ADMIN_URL=https://staging.supermandi.tech/retailer;RATE_LIMIT_MULTIPLIER=5;EMAIL_PROVIDER=smtp;SMTP_HOST=smtp.gmail.com;SMTP_PORT=587;SMTP_USER=supermanditech@gmail.com;EMAIL_FROM=SuperMandi <supermanditech@gmail.com>;PORTAL_BASE_URL=https://staging.supermandi.tech;POS_APP_DOWNLOAD_URL=https://play.google.com/apps/testing/com.supermanditech.supermandipos;ADMIN_EMAIL_ALLOWLIST=supermanditech@gmail.com;DOCUMENT_STORAGE_DIR=/tmp/documents;GCS_DOCUMENTS_BUCKET=supermandi-pos-documents;GCS_IMAGES_BUCKET=supermandi-pos-images;GCP_PROJECT_ID=${{ env.GCP_PROJECT }};FEATURE_REORDER_ENABLED=true;SUPERMANDI_ENTITY_NAME=SUPERMANDI TECH PRIVATE LIMITED;SUPERMANDI_GSTIN=08ABRCS8282R1ZY;SUPERMANDI_ADDRESS=166/1 Bhandu Khurd Jodhpur Rajasthan 342014;SUPERMANDI_STATE=Rajasthan;FRONTEND_URL=https://staging.supermandi.tech;ALLOWED_ORIGINS=https://staging.supermandi.tech,https://www.staging.supermandi.tech;CORS_ALLOWED_ORIGINS=https://staging.supermandi.tech,https://www.staging.supermandi.tech" \
            --set-secrets="DATABASE_URL=database-url:latest,DB_PASSWORD=postgres-password:latest,JWT_SECRET=jwt-secret:latest,SERVICE_TOKEN_SECRET=SERVICE_TOKEN_SECRET:latest,ADMIN_TOKEN=admin-token:latest,SMTP_PASS=smtp-password:latest,WHATSAPP_ACCESS_TOKEN=WHATSAPP_ACCESS_TOKEN:latest,WHATSAPP_PHONE_NUMBER_ID=WHATSAPP_PHONE_NUMBER_ID:latest,WHATSAPP_VERIFY_TOKEN=WHATSAPP_VERIFY_TOKEN:latest,WHATSAPP_APP_SECRET=WHATSAPP_APP_SECRET:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest" \
            --allow-unauthenticated \
            --quiet
          echo "    OK: $SERVICE_NAME deployed"

          # STAGE-023: Ensure traffic routes to latest revision.
          # Rollbacks pin traffic to a specific revision via --to-revisions.
          # Without --to-latest, all future deploys create revisions with 0% traffic.
          gcloud run services update-traffic "$SERVICE_NAME" \
            --to-latest \
            --region="${{ env.GCP_REGION }}" \
            --quiet
          echo "    OK: $SERVICE_NAME traffic → LATEST"

          # Capture main-backend URL for api-gateway config
          MB_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region="${{ env.GCP_REGION }}" \
            --format="value(status.url)")
          echo "main_backend_url=$MB_URL" >> "$GITHUB_OUTPUT"
          echo "  main-backend URL: $MB_URL"

      - name: Deploy api-gateway to staging
        run: |
          VPC_CONNECTOR="projects/${{ env.GCP_PROJECT }}/locations/${{ env.GCP_REGION }}/connectors/supermandi-connector"
          SERVICE_NAME="api-gateway"
          IMAGE="${{ env.AR_REPO }}/api-gateway:${{ env.SHA }}"
          MB_URL="${{ steps.deploy-main-backend.outputs.main_backend_url }}"
          echo "--- Deploying: $SERVICE_NAME"
          echo "    ADMIN_SERVICE_URL=$MB_URL"
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --region="${{ env.GCP_REGION }}" \
            --service-account=cloudrun-backend@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            --ingress=internal-and-cloud-load-balancing \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --startup-probe="" \
            --vpc-connector="$VPC_CONNECTOR" \
            --vpc-egress=all-traffic \
            --set-env-vars="^;^NODE_ENV=staging;GIT_SHA=${{ env.SHA }};MIN_APP_VERSION=${{ env.APP_VERSION }};ADMIN_SERVICE_URL=$MB_URL;REDIS_HOST=10.107.71.27;REDIS_PORT=6379;REDIS_URL=redis://10.107.71.27:6379;CORS_ALLOWED_ORIGINS=https://staging.supermandi.tech,https://www.staging.supermandi.tech" \
            --set-secrets="JWT_SECRET=jwt-secret:latest,ADMIN_TOKEN=admin-token:latest" \
            --allow-unauthenticated \
            --quiet
          echo "    OK: $SERVICE_NAME deployed"

          # STAGE-023: Ensure traffic routes to latest revision (prevent rollback pinning)
          gcloud run services update-traffic "$SERVICE_NAME" \
            --to-latest \
            --region="${{ env.GCP_REGION }}" \
            --quiet
          echo "    OK: $SERVICE_NAME traffic → LATEST"

      # STAGE-002: Portal deploy failure = pipeline failure (no silent swallow)
      # BLK-LANDING-PORT: nginx:alpine dropped CAP_NET_BIND_SERVICE for non-root users —
      # port 80 requires root. Changed all nginx portals to port 8080 (Cloud Run standard).
      # supplier-portal (Next.js) uses Cloud Run's PORT env var (8080) automatically.
      - name: Deploy nginx portals to staging (port 8080)
        run: |
          NGINX_PORTALS=(retailer-admin superadmin landing)
          FAILED=0
          for portal in "${NGINX_PORTALS[@]}"; do
            SERVICE_NAME="${portal}"
            IMAGE="${{ env.AR_REPO }}/${portal}:${{ env.SHA }}"
            echo "--- Deploying: $SERVICE_NAME (nginx, port 8080)"
            if ! gcloud run deploy "$SERVICE_NAME" \
              --image="$IMAGE" \
              --region="${{ env.GCP_REGION }}" \
              --service-account=cloudrun-frontend@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
              --ingress=internal-and-cloud-load-balancing \
              --port=8080 \
              --memory=256Mi \
              --cpu=1 \
              --min-instances=0 \
              --max-instances=3 \
              --startup-probe="" \
              --set-env-vars="GIT_SHA=${{ env.SHA }}" \
              --allow-unauthenticated \
              --quiet; then
              echo "FATAL: $portal deploy FAILED"
              FAILED=$((FAILED + 1))
            else
              echo "    OK: $SERVICE_NAME deployed"
              gcloud run services update-traffic "$SERVICE_NAME" \
                --to-latest \
                --region="${{ env.GCP_REGION }}" \
                --quiet
              echo "    OK: $SERVICE_NAME traffic → LATEST"
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "BLOCKED: $FAILED nginx portal(s) failed to deploy."
            exit 1
          fi
          echo "All 3 nginx portals deployed."

      - name: Deploy supplier-portal to staging (Next.js)
        run: |
          SERVICE_NAME="supplier-portal"
          IMAGE="${{ env.AR_REPO }}/supplier-portal:${{ env.SHA }}"
          echo "--- Deploying: $SERVICE_NAME (Next.js, default port)"
          if ! gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --region="${{ env.GCP_REGION }}" \
            --service-account=cloudrun-frontend@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            --ingress=internal-and-cloud-load-balancing \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --startup-probe="" \
            --set-env-vars="GIT_SHA=${{ env.SHA }}" \
            --allow-unauthenticated \
            --quiet; then
            echo "FATAL: supplier-portal deploy FAILED"
            exit 1
          fi
          echo "    OK: $SERVICE_NAME deployed"
          gcloud run services update-traffic "$SERVICE_NAME" \
            --to-latest \
            --region="${{ env.GCP_REGION }}" \
            --quiet
          echo "    OK: $SERVICE_NAME traffic → LATEST"
          echo "All 4 portals deployed successfully."

      # STAGE-022: Post-deploy traffic routing verification (BLOCKING).
      # gcloud run deploy exits 0 before traffic is routed to the new revision.
      # This step polls until each service's traffic revision is DIFFERENT from
      # the pre-deploy revision (i.e., traffic shifted to the newly deployed one).
      # Without this gate, smoke tests hit old revisions with stale SHAs.
      - name: "Verify traffic routed to new revisions (BLOCKING)"
        run: |
          echo "=== STAGE-022: Post-Deploy Traffic Routing Verification ==="
          echo "Waiting for all services to route traffic to new revisions..."
          echo ""

          SERVICES=(api-gateway main-backend retailer-admin supplier-portal superadmin landing)
          PRE_REVISIONS="${{ steps.pre-revisions.outputs.pre_revisions }}"
          MAX_WAIT=180  # 3 minutes (generous for cold starts)
          POLL_INTERVAL=10
          FAIL=0

          for svc in "${SERVICES[@]}"; do
            # Extract pre-deploy revision for this service
            PRE_REV=$(echo "$PRE_REVISIONS" | grep -oP "${svc}=\K[^,]+" || echo "unknown")
            echo "--- $svc (pre-deploy: $PRE_REV)"

            ROUTED=false
            ELAPSED=0
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              TRAFFIC_REV=$(gcloud run services describe "$svc" \
                --region="${{ env.GCP_REGION }}" \
                --format="value(status.traffic[0].revisionName)" 2>/dev/null || echo "")

              if [ -n "$TRAFFIC_REV" ] && [ "$TRAFFIC_REV" != "$PRE_REV" ]; then
                # Verify the new revision is Active (not just Ready with reason=Retired)
                ACTIVE=$(gcloud run revisions describe "$TRAFFIC_REV" \
                  --region="${{ env.GCP_REGION }}" \
                  --format="value(status.conditions.filter(type=Active).status)" 2>/dev/null || echo "")
                echo "  PASS: $svc → $TRAFFIC_REV (Active=$ACTIVE) [${ELAPSED}s]"
                ROUTED=true
                break
              fi

              ELAPSED=$((ELAPSED + POLL_INTERVAL))
              echo "  Waiting... traffic still on $TRAFFIC_REV [${ELAPSED}s / ${MAX_WAIT}s]"
              sleep $POLL_INTERVAL
            done

            if [ "$ROUTED" = "false" ]; then
              echo "  FATAL: $svc — traffic NOT routed to new revision after ${MAX_WAIT}s"
              echo "    Still on: $TRAFFIC_REV (pre-deploy: $PRE_REV)"
              # Dump diagnostics
              echo "    --- Diagnostics ---"
              LATEST=$(gcloud run services describe "$svc" \
                --region="${{ env.GCP_REGION }}" \
                --format="json(status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic)" 2>/dev/null || echo "{}")
              echo "    $LATEST"
              FAIL=$((FAIL + 1))
            fi
          done

          echo ""
          if [ $FAIL -gt 0 ]; then
            echo "BLOCKED: $FAIL service(s) did not route traffic to new revisions."
            echo "This means gcloud run deploy created revisions but Cloud Run did not"
            echo "activate them. Check service logs and revision conditions."
            exit 1
          fi
          echo "PASS: All 6 services routed traffic to new revisions."

      # STAGE-021 + STAGE-023: GCP-Git Parity Gate (BLOCKING)
      # Verify each service's serving revision has GIT_SHA env var matching
      # the deployed SHA. Cloud Run stores images by digest (sha256:...) not
      # tag, so we check the GIT_SHA env var which we set during deploy.
      - name: "GCP-Git parity gate (BLOCKING)"
        run: |
          echo "=== GCP-Git Parity Gate ==="
          echo "Verifying serving revisions have GIT_SHA=${{ env.SHA }}"
          echo ""

          SERVICES=(api-gateway main-backend retailer-admin supplier-portal superadmin landing)
          MISMATCH=0
          for svc in "${SERVICES[@]}"; do
            # Get the revision currently receiving traffic
            TRAFFIC_REV=$(gcloud run services describe "$svc" \
              --region="${{ env.GCP_REGION }}" \
              --format="value(status.traffic[0].revisionName)" 2>/dev/null || echo "")
            if [ -z "$TRAFFIC_REV" ]; then
              echo "  FAIL: $svc — cannot determine traffic revision"
              MISMATCH=$((MISMATCH + 1))
              continue
            fi

            # Check GIT_SHA env var in the serving revision
            # NOTE: gcloud --format doesn't support .filter() on env arrays.
            # Use --format=json + jq to extract the value reliably.
            GIT_SHA_VAL=$(gcloud run revisions describe "$TRAFFIC_REV" \
              --region="${{ env.GCP_REGION }}" \
              --format=json 2>/dev/null \
              | jq -r '.spec.containers[0].env[]? | select(.name=="GIT_SHA") | .value // empty' 2>/dev/null || echo "")

            if [ "$GIT_SHA_VAL" = "${{ env.SHA }}" ]; then
              echo "  PASS: $svc ($TRAFFIC_REV) GIT_SHA=$GIT_SHA_VAL"
            else
              echo "  FAIL: $svc ($TRAFFIC_REV) GIT_SHA=$GIT_SHA_VAL (expected ${{ env.SHA }})"
              MISMATCH=$((MISMATCH + 1))
            fi
          done

          echo ""
          if [ $MISMATCH -gt 0 ]; then
            echo "BLOCKED: $MISMATCH service(s) have GIT_SHA mismatch."
            echo "GCP is NOT running the code from git SHA ${{ env.SHA }}."
            exit 1
          fi
          echo "PASS: All 6 services have GIT_SHA=${{ env.SHA }}. GCP-Git parity confirmed."
          echo ""

  # ==========================================================================
  # ZRP-C-033/034/035/036/037/038: Artifact Integrity & Hygiene
  # ==========================================================================
  artifact-verification:
    name: "ZRP: Artifact Verification"
    needs: [gate, deploy-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: "ZRP-C-033/034: Artifact integrity (BLOCKING)"
        env:
          GCP_PROJECT: ${{ env.GCP_PROJECT }}
          GCP_REGION: ${{ env.GCP_REGION }}
          AR_REPO: ${{ env.AR_REPO }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          chmod +x scripts/gates/artifact-integrity.sh
          bash scripts/gates/artifact-integrity.sh

      - name: "ZRP-C-035/036/037/038: Artifact hygiene (WARNING)"
        continue-on-error: true
        env:
          GCP_PROJECT: ${{ env.GCP_PROJECT }}
          GCP_REGION: ${{ env.GCP_REGION }}
        run: |
          chmod +x scripts/gates/artifact-hygiene.sh
          bash scripts/gates/artifact-hygiene.sh

  # ==========================================================================
  # ZRP-L: Routing Infrastructure + Smoke Verification
  # Validates GCP LB/URL map/NEGs match ROUTING_SPEC.json, then hits
  # every portal + POS API through staging.supermandi.tech domain.
  # ==========================================================================
  routing-verification:
    name: "ZRP-L: Routing Verification"
    needs: [gate, deploy-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: "ZRP-L-023..030: Routing infra validation (BLOCKING)"
        env:
          GCP_PROJECT: ${{ env.GCP_PROJECT }}
          GCP_REGION: ${{ env.GCP_REGION }}
        run: |
          chmod +x scripts/gates/routing-infra-validate.sh
          bash scripts/gates/routing-infra-validate.sh

      - name: "ZRP-L-031..047: Routing smoke tests (BLOCKING)"
        env:
          STAGING_DOMAIN: "https://staging.supermandi.tech"
          CURL_TIMEOUT: "15"
          MAX_RETRIES: "3"
          RETRY_DELAY: "10"
        run: |
          chmod +x scripts/gates/routing-smoke.sh
          bash scripts/gates/routing-smoke.sh
          chmod +x scripts/gates/otp-auth-smoke.sh
          bash scripts/gates/otp-auth-smoke.sh
          chmod +x scripts/gates/sell-home-smoke.sh
          bash scripts/gates/sell-home-smoke.sh

  # ==========================================================================
  # STAGE-017: Hardened smoke tests — every check has retries, timeouts,
  # body validation, and explicit BLOCKING behavior. No silent WARNs.
  # Learned from 3 pipeline failures: cold-start, redirects, SHA lag.
  # ==========================================================================
  smoke-test:
    name: Staging Smoke Test
    needs: [gate, deploy-staging, artifact-verification, routing-verification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ needs.gate.outputs.sha_short }}
      CURL_TIMEOUT: 15
      RETRY_DELAY: 10
      # All smoke tests route through the load balancer because Cloud Run
      # services use --ingress=internal-and-cloud-load-balancing, which
      # blocks direct *.run.app access from external CI runners.
      STAGING_URL: https://staging.supermandi.tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Resolve service URLs
        id: url
        run: |
          # Resolve Cloud Run URLs for gcloud operations (not HTTP checks — ingress blocks direct access).
          SERVICES=(api-gateway main-backend retailer-admin supplier-portal superadmin landing)
          ALL_OK=true
          for svc in "${SERVICES[@]}"; do
            URL=$(gcloud run services describe "$svc" \
              --region="${{ env.GCP_REGION }}" \
              --format="value(status.url)" 2>/dev/null || echo "")
            KEY=$(echo "$svc" | tr '-' '_')
            echo "${KEY}_url=$URL" >> "$GITHUB_OUTPUT"
            if [ -z "$URL" ]; then
              echo "WARN: $svc — no URL resolved"
              ALL_OK=false
            else
              echo "OK: $svc → $URL"
            fi
          done
          if [ "$ALL_OK" = "false" ]; then
            echo "WARNING: Some service URLs could not be resolved (new services may not exist yet)"
          fi

      # ---- Gate 1: api-gateway health via LB (5 retries, body validated) ----
      - name: "Gate 1: api-gateway health (BLOCKING)"
        run: |
          echo "Checking api-gateway health at ${{ env.STAGING_URL }}/health ..."
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -sf --max-time ${{ env.CURL_TIMEOUT }} "${{ env.STAGING_URL }}/health" 2>/dev/null || echo "")
            echo "  Attempt $attempt: $BODY"
            if echo "$BODY" | grep -q '"status":"ok"'; then
              echo "PASS: api-gateway health OK (body validated, via LB)"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "  Retrying in ${{ env.RETRY_DELAY }}s..."
              sleep ${{ env.RETRY_DELAY }}
            fi
          done
          echo "FATAL: api-gateway /health did not return {\"status\":\"ok\"} after 5 attempts"
          echo "  Last response: $BODY"
          exit 1

      # ---- Gate 2: main-backend health via gateway proxy (5 retries) ----
      - name: "Gate 2: main-backend health (BLOCKING)"
        run: |
          echo "Checking main-backend health via gateway proxy at ${{ env.STAGING_URL }}/api/v1/pos/health ..."
          echo "(Direct Cloud Run URLs blocked by ingress — using LB → gateway → backend path)"
          for attempt in 1 2 3 4 5; do
            STATUS=$(curl -s --max-time ${{ env.CURL_TIMEOUT }} -o /dev/null -w "%{http_code}" "${{ env.STAGING_URL }}/api/v1/pos/health" 2>/dev/null || echo "000")
            echo "  Attempt $attempt: HTTP $STATUS"
            # Any non-5xx response proves backend is alive (401/403 = auth working, 200 = health ok)
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "PASS: main-backend reachable via gateway (HTTP $STATUS)"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "  Retrying in ${{ env.RETRY_DELAY }}s..."
              sleep ${{ env.RETRY_DELAY }}
            fi
          done
          echo "FATAL: main-backend unreachable via gateway after 5 attempts (HTTP $STATUS)"
          exit 1

      # ---- Gate 3: Version SHA — api-gateway via LB (5 retries) ----
      - name: "Gate 3: api-gateway version SHA (BLOCKING)"
        run: |
          EXPECTED="${{ env.SHA }}"
          echo "Checking api-gateway version at ${{ env.STAGING_URL }}/version (expecting $EXPECTED)..."
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -sf --max-time ${{ env.CURL_TIMEOUT }} "${{ env.STAGING_URL }}/version" 2>/dev/null || echo "{}")
            echo "  Attempt $attempt: $BODY"
            if echo "$BODY" | grep -q "$EXPECTED"; then
              echo "PASS: api-gateway SHA matches ($EXPECTED)"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "  SHA not yet matching (cold-start lag). Retrying in ${{ env.RETRY_DELAY }}s..."
              sleep ${{ env.RETRY_DELAY }}
            fi
          done
          echo "FATAL: api-gateway /version SHA mismatch after 5 attempts"
          echo "  Expected: $EXPECTED"
          echo "  Last response: $BODY"
          exit 1

      # ---- Gate 4: Version SHA — main-backend via gcloud (ingress blocks HTTP) ----
      - name: "Gate 4: main-backend version SHA (BLOCKING)"
        run: |
          EXPECTED="${{ env.SHA }}"
          echo "Checking main-backend image tag via gcloud (direct URL blocked by ingress)..."
          for attempt in 1 2 3 4 5; do
            IMAGE=$(gcloud run services describe main-backend \
              --region="${{ env.GCP_REGION }}" \
              --format="value(spec.template.spec.containers[0].image)" 2>/dev/null || echo "")
            echo "  Attempt $attempt: $IMAGE"
            if echo "$IMAGE" | grep -q "$EXPECTED"; then
              echo "PASS: main-backend image contains SHA ($EXPECTED)"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "  Image not yet matching. Retrying in ${{ env.RETRY_DELAY }}s..."
              sleep ${{ env.RETRY_DELAY }}
            fi
          done
          echo "FATAL: main-backend image SHA mismatch after 5 attempts"
          echo "  Expected SHA in tag: $EXPECTED"
          echo "  Last image: $IMAGE"
          exit 1

      # ---- Gate 5: Portal health checks via LB (3 retries each, follows redirects) ----
      - name: "Gate 5: Portal health checks (BLOCKING)"
        run: |
          # Route through LB — direct Cloud Run URLs blocked by ingress
          declare -A PORTAL_PATHS=(
            [retailer-admin]="/retailer/"
            [supplier-portal]="/supplier/"
            [superadmin]="/admin/"
            [landing]="/"
          )
          MAX_RETRIES=3
          FAILED=0
          for portal in retailer-admin supplier-portal superadmin landing; do
            BASE_PATH="${PORTAL_PATHS[$portal]}"
            PORTAL_PASS=false
            for attempt in $(seq 1 $MAX_RETRIES); do
              STATUS=$(curl -sL --max-time ${{ env.CURL_TIMEOUT }} -o /dev/null -w "%{http_code}" "${{ env.STAGING_URL }}${BASE_PATH}" 2>/dev/null || echo "000")
              echo "  $portal attempt $attempt: HTTP $STATUS (${{ env.STAGING_URL }}${BASE_PATH})"
              if [ "$STATUS" = "200" ]; then
                echo "  PASS: $portal — HTTP 200"
                PORTAL_PASS=true
                break
              fi
              if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                echo "  Retrying in ${{ env.RETRY_DELAY }}s (cold-start)..."
                sleep ${{ env.RETRY_DELAY }}
              fi
            done
            if [ "$PORTAL_PASS" = "false" ]; then
              echo "  FAIL: $portal — HTTP $STATUS after $MAX_RETRIES attempts"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "FATAL: $FAILED portal(s) failed smoke test after retries"
            exit 1
          fi
          echo "PASS: All 4 portals healthy via LB (with redirect handling + retries)"

      # ---- Gate 6: Auth guard via LB (3 retries, ALL unexpected statuses block) ----
      - name: "Gate 6: Auth guard (BLOCKING)"
        run: |
          URL="${{ env.STAGING_URL }}"
          echo "Checking auth guard at $URL/api/v1/admin/stores (no token)..."
          for attempt in 1 2 3; do
            STATUS=$(curl -s --max-time ${{ env.CURL_TIMEOUT }} -o /dev/null -w "%{http_code}" "$URL/api/v1/admin/stores" 2>/dev/null || echo "000")
            echo "  Attempt $attempt: HTTP $STATUS"
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
              echo "PASS: Auth guard working — unauthenticated request rejected ($STATUS)"
              exit 0
            elif [ "$STATUS" = "200" ]; then
              echo "FATAL: /api/v1/admin/stores returned 200 WITHOUT authentication"
              echo "BLOCKED: Auth guard is not functioning — security breach risk"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "  Unexpected status. Retrying in ${{ env.RETRY_DELAY }}s (cold-start)..."
              sleep ${{ env.RETRY_DELAY }}
            fi
          done
          echo "FATAL: Auth guard returned unexpected HTTP $STATUS after 3 attempts"
          echo "  Expected: 401 or 403. Got: $STATUS"
          echo "  This means the gateway is not routing to the backend correctly."
          exit 1

      # ---- Gate 7: API gateway → main-backend connectivity via LB (BLOCKING) ----
      - name: "Gate 7: Gateway-to-backend connectivity (BLOCKING)"
        run: |
          URL="${{ env.STAGING_URL }}"
          echo "Verifying api-gateway can proxy to main-backend..."
          # Hit a known API route through the gateway. Even without auth, we should get
          # 401/403 (auth middleware) — NOT 502/503/504 (backend unreachable).
          for attempt in 1 2 3; do
            STATUS=$(curl -s --max-time ${{ env.CURL_TIMEOUT }} -o /dev/null -w "%{http_code}" "$URL/api/v1/pos/health" 2>/dev/null || echo "000")
            echo "  Attempt $attempt: HTTP $STATUS"
            # Any response from the backend is good (401, 403, 404, 200 all mean connectivity works)
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "PASS: Gateway successfully proxied to main-backend (HTTP $STATUS)"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "  Backend may still be starting. Retrying in ${{ env.RETRY_DELAY }}s..."
              sleep ${{ env.RETRY_DELAY }}
            fi
          done
          echo "FATAL: api-gateway cannot reach main-backend (HTTP $STATUS after 3 attempts)"
          echo "  Expected: any 2xx/3xx/4xx from backend. Got: $STATUS (server error / unreachable)"
          echo "  Check: ADMIN_SERVICE_URL env var, VPC connector, main-backend health"
          exit 1

      # ---- Gate 8: ZRP-F-002 — JWT multi-route validation via LB (BLOCKING) ----
      - name: "Gate 8: JWT multi-route auth (BLOCKING)"
        run: |
          URL="${{ env.STAGING_URL }}"
          echo "=== ZRP-F-002: JWT multi-route validation ==="
          ENDPOINTS=(
            "/api/v1/admin/stores"
            "/api/v1/pos/scan/resolve"
            "/api/v1/admin/dashboard"
          )
          FAIL=0
          for endpoint in "${ENDPOINTS[@]}"; do
            STATUS=$(curl -s --max-time ${{ env.CURL_TIMEOUT }} -o /dev/null -w "%{http_code}" "$URL$endpoint" 2>/dev/null || echo "000")
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
              echo "  PASS: $endpoint → $STATUS (auth enforced)"
            elif [ "$STATUS" = "200" ]; then
              echo "  FAIL: $endpoint → $STATUS (NO AUTH — security breach)"
              FAIL=$((FAIL + 1))
            elif [ "$STATUS" -ge 500 ]; then
              echo "  WARN: $endpoint → $STATUS (server error, not auth issue)"
            else
              echo "  OK: $endpoint → $STATUS (protected)"
            fi
          done
          if [ $FAIL -gt 0 ]; then
            echo "BLOCKED: $FAIL endpoint(s) accessible without authentication"
            exit 1
          fi
          echo "PASS: All ${#ENDPOINTS[@]} protected endpoints enforce authentication."

      # ---- Gate 9: ZRP-F-007 — Security headers verification via LB (BLOCKING) ----
      - name: "Gate 9: Security headers (BLOCKING)"
        run: |
          URL="${{ env.STAGING_URL }}"
          echo "=== ZRP-F-007: Security Headers Verification ==="
          HEADERS=$(curl -sI --max-time ${{ env.CURL_TIMEOUT }} "$URL/health" 2>/dev/null || echo "")
          FAIL=0

          # X-Content-Type-Options: nosniff
          if echo "$HEADERS" | grep -qi "x-content-type-options.*nosniff"; then
            echo "  PASS: X-Content-Type-Options: nosniff"
          else
            echo "  WARN: X-Content-Type-Options header missing (Cloud Run may strip)"
          fi

          # Check that Content-Type is set (basic sanity)
          if echo "$HEADERS" | grep -qi "content-type"; then
            echo "  PASS: Content-Type header present"
          else
            echo "  WARN: Content-Type header missing"
          fi

          # Verify server is not exposing version info
          if echo "$HEADERS" | grep -qi "x-powered-by"; then
            echo "  WARN: X-Powered-By header exposed (should be removed by helmet)"
          else
            echo "  PASS: X-Powered-By not exposed"
          fi

          echo "PASS: Security headers checked."

      # ---- Gate 10: ZRP-H-008 — Health endpoint latency via LB (BLOCKING) ----
      - name: "Gate 10: Health latency < 2s (BLOCKING)"
        run: |
          echo "=== ZRP-H-008: Health Endpoint Latency ==="
          # Route through LB — direct Cloud Run URLs blocked by ingress
          ENDPOINTS=(
            "api-gateway:${{ env.STAGING_URL }}/health"
            "main-backend:${{ env.STAGING_URL }}/api/v1/pos/health"
          )
          FAIL=0
          for entry in "${ENDPOINTS[@]}"; do
            SVC="${entry%%:*}"
            URL="${entry#*:}"
            LATENCY=$(curl -sf --max-time 10 -o /dev/null -w "%{time_total}" "$URL" 2>/dev/null || echo "99")
            LATENCY_MS=$(echo "$LATENCY" | awk '{printf "%.0f", $1 * 1000}')
            if [ "$LATENCY_MS" -le 2000 ]; then
              echo "  PASS: $SVC responded in ${LATENCY}s (${LATENCY_MS}ms)"
            else
              echo "  FAIL: $SVC took ${LATENCY}s (${LATENCY_MS}ms > 2000ms)"
              FAIL=$((FAIL + 1))
            fi
          done
          if [ $FAIL -gt 0 ]; then
            echo "BLOCKED: $FAIL service(s) exceeded 2s latency"
            exit 1
          fi
          echo "PASS: All endpoints respond within 2 seconds."

      # ---- Gate 11: ZRP-I-018 — API error format via LB (JSON, not HTML) ----
      - name: "Gate 11: API error format JSON (BLOCKING)"
        run: |
          URL="${{ env.STAGING_URL }}"
          echo "=== ZRP-I-018: API Error Format Consistency ==="
          # Hit a nonexistent API route
          RESPONSE=$(curl -s --max-time ${{ env.CURL_TIMEOUT }} -w "\n%{content_type}" "$URL/api/v1/nonexistent-route-zrp-check" 2>/dev/null || echo "")
          BODY=$(echo "$RESPONSE" | head -n -1)
          CONTENT_TYPE=$(echo "$RESPONSE" | tail -1)

          echo "  Response body: $BODY"
          echo "  Content-Type: $CONTENT_TYPE"

          if echo "$CONTENT_TYPE" | grep -qi "application/json"; then
            echo "PASS: API errors return JSON (Content-Type: $CONTENT_TYPE)"
          elif echo "$BODY" | grep -q "<!DOCTYPE\|<html"; then
            echo "FAIL: API returned HTML error page instead of JSON"
            exit 1
          else
            echo "PASS: API did not return HTML error (Content-Type: $CONTENT_TYPE)"
          fi

      # ---- Gate 12: Canary endpoint suite — critical path 5xx detection (BLOCKING) ----
      # STAGE.OBS.HISTORICAL_5XX.001: Historical 5xx spikes on registration/admin paths
      # went undetected until manual log review. This gate catches 5xx on critical paths
      # before traffic cutover.
      - name: "Gate 12: Canary endpoint 5xx detection (BLOCKING)"
        run: |
          URL="${{ env.STAGING_URL }}"
          echo "=== Canary Endpoint Suite: Critical Path 5xx Detection ==="
          # These endpoints historically produced 5xx on stale revisions.
          # Any non-5xx response (400, 401, 403, 404) proves the backend is alive.
          # A 5xx means the new revision is broken — block deploy.
          CANARY_ENDPOINTS=(
            "/api/v1/retailer-admin/registration/lookup?phone=0000000000"
            "/api/v1/retailer-admin/auth/login"
            "/api/v1/admin/monitoring/health"
            "/api/v1/pos/health"
            "/api/v1/supplier/auth/login"
          )
          FAIL=0
          TOTAL=${#CANARY_ENDPOINTS[@]}
          for endpoint in "${CANARY_ENDPOINTS[@]}"; do
            PASS=false
            for attempt in 1 2 3; do
              STATUS=$(curl -s --max-time ${{ env.CURL_TIMEOUT }} -o /dev/null -w "%{http_code}" "$URL$endpoint" 2>/dev/null || echo "000")
              if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
                echo "  PASS: $endpoint → HTTP $STATUS"
                PASS=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "  Attempt $attempt: $endpoint → HTTP $STATUS (5xx/timeout). Retrying in ${{ env.RETRY_DELAY }}s..."
                sleep ${{ env.RETRY_DELAY }}
              fi
            done
            if [ "$PASS" = "false" ]; then
              echo "  FAIL: $endpoint → HTTP $STATUS after 3 attempts (5xx)"
              FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          if [ $FAIL -gt 0 ]; then
            echo "BLOCKED: $FAIL/$TOTAL canary endpoints returned 5xx"
            echo "  This indicates the new revision has broken critical API paths."
            echo "  Investigate main-backend and api-gateway logs before retrying."
            exit 1
          fi
          echo "PASS: All $TOTAL canary endpoints healthy (no 5xx detected)"

      # ---- Gate 13: Non-breakable deploy parity gate (BLOCKING) ----
      # Enforces runtime routing/build/API/GCP parity for:
      # - retailer web
      # - supplier web
      # - superadmin web
      # - POS app (API and /pos distribution path)
      - name: "Gate 13: Non-Breakable Surface/Build/API/GCP Parity (BLOCKING)"
        env:
          STAGING_URL: ${{ env.STAGING_URL }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha_short }}
          GCP_PROJECT: ${{ env.GCP_PROJECT }}
          GCP_REGION: ${{ env.GCP_REGION }}
          NONBREAKABLE_CONTRACT_FILE: workflow/state/deployment_runtime_contract.json
        run: |
          node scripts/gates/nonbreakable-deploy-parity.js

      # ---- ZRP Parity Report — GitHub Step Summary ----
      - name: "ZRP: Staging Smoke Parity Report"
        if: always()
        run: |
          echo "## ZRP Staging Smoke Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**SHA:** ${{ env.SHA }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Description | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 1 | api-gateway health | ${{ job.status == 'success' && 'PASS' || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 2 | main-backend health | ${{ job.status == 'success' && 'PASS' || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 3 | api-gateway SHA | ${{ job.status == 'success' && 'PASS' || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 4 | main-backend SHA | ${{ job.status == 'success' && 'PASS' || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 5 | Portal health (4) | ${{ job.status == 'success' && 'PASS' || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 6 | Auth guard | ${{ job.status == 'success' && 'PASS' || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 7 | Gateway connectivity | ${{ job.status == 'success' && 'PASS' || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8 | JWT multi-route | ${{ job.status == 'success' && 'PASS' || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 9 | Security headers | ${{ job.status == 'success' && 'PASS' || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 10 | Health latency | ${{ job.status == 'success' && 'PASS' || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 11 | API error format | ${{ job.status == 'success' && 'PASS' || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 12 | Canary 5xx detection | ${{ job.status == 'success' && 'PASS' || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 13 | Non-breakable surface/build/API/GCP parity | ${{ job.status == 'success' && 'PASS' || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "*ZRP Parity Report v1.1*" >> "$GITHUB_STEP_SUMMARY"

      # STAGE-007 + STAGE-021: Auto-rollback + delete failed revisions on smoke failure.
      # On failure: (1) rollback traffic to pre-deploy revisions, (2) delete ALL
      # revisions created by this deploy so GCP has zero stale artifacts.
      # Learned: failed deploys leave orphan revisions that clutter GCP state
      # and make parity analysis between GCP and Git impossible.
      - name: Auto-rollback and cleanup on failure
        if: failure()
        run: |
          echo "=== SMOKE TEST FAILED — Rollback + Cleanup ==="
          echo ""

          # --- Phase 1: Rollback traffic to pre-deploy revisions ---
          echo "Phase 1: Rolling back traffic..."
          PRE_REVISIONS="${{ needs.deploy-staging.outputs.pre_revisions }}"
          if [ -z "$PRE_REVISIONS" ]; then
            echo "WARN: No pre-deploy revisions recorded. Manual rollback required."
            echo "  Use: gcloud run services update-traffic <SERVICE> --to-revisions=<REVISION>=100 --region=${{ env.GCP_REGION }}"
            exit 1
          fi
          IFS=',' read -ra PAIRS <<< "$PRE_REVISIONS"
          ROLLBACK_FAILED=0
          declare -A KEPT_REVS
          for pair in "${PAIRS[@]}"; do
            [ -z "$pair" ] && continue
            SVC="${pair%%=*}"
            REV="${pair##*=}"
            KEPT_REVS["$SVC"]="$REV"
            if [ "$REV" = "none" ] || [ -z "$REV" ]; then
              echo "  SKIP: $SVC (no previous revision)"
              continue
            fi
            echo "  Rolling back $SVC → $REV"
            if gcloud run services update-traffic "$SVC" \
              --to-revisions="$REV=100" \
              --region="${{ env.GCP_REGION }}" \
              --quiet 2>/dev/null; then
              echo "  OK: $SVC rolled back"
            else
              echo "  FAIL: Could not rollback $SVC"
              ROLLBACK_FAILED=$((ROLLBACK_FAILED + 1))
            fi
          done
          if [ $ROLLBACK_FAILED -gt 0 ]; then
            echo "WARNING: $ROLLBACK_FAILED service(s) could not be rolled back"
          else
            echo "All services rolled back to pre-deploy revisions."
          fi

          # STAGE-023: Restore --to-latest on all services after rollback.
          # Without this, --to-revisions pins traffic permanently and ALL
          # future deploys create revisions with 0% traffic.
          echo ""
          echo "Phase 1b: Restoring --to-latest routing..."
          for pair in "${PAIRS[@]}"; do
            [ -z "$pair" ] && continue
            SVC="${pair%%=*}"
            gcloud run services update-traffic "$SVC" \
              --to-latest \
              --region="${{ env.GCP_REGION }}" \
              --quiet 2>/dev/null && echo "  OK: $SVC → LATEST restored" || echo "  WARN: $SVC → could not restore LATEST"
          done

          # --- Phase 2: Delete stale revisions (keep only traffic revision) ---
          echo ""
          echo "Phase 2: Cleaning up stale revisions..."
          SERVICES=(api-gateway main-backend retailer-admin supplier-portal superadmin landing)
          DELETED=0
          for svc in "${SERVICES[@]}"; do
            KEEP="${KEPT_REVS[$svc]}"
            if [ -z "$KEEP" ] || [ "$KEEP" = "none" ]; then
              echo "  SKIP: $svc (no known good revision)"
              continue
            fi
            # List all revisions for this service
            ALL_REVS=$(gcloud run revisions list \
              --service="$svc" \
              --region="${{ env.GCP_REGION }}" \
              --format="value(metadata.name)" 2>/dev/null || echo "")
            for rev in $ALL_REVS; do
              if [ "$rev" = "$KEEP" ]; then
                echo "  KEEP: $rev (traffic revision)"
              else
                echo "  DELETE: $rev (stale)"
                gcloud run revisions delete "$rev" \
                  --region="${{ env.GCP_REGION }}" \
                  --quiet 2>/dev/null && DELETED=$((DELETED + 1)) || echo "    WARN: Could not delete $rev"
              fi
            done
          done
          echo ""
          echo "Cleanup complete: $DELETED stale revision(s) deleted."

          # --- Phase 3: GCP-Git Parity Report ---
          echo ""
          echo "Phase 3: GCP-Git Parity Check"
          echo "  Git HEAD: ${{ env.SHA }}"
          echo "  Deploy target: FAILED — no service running ${{ env.SHA }}"
          echo "  All services on pre-deploy revisions (rollback)"
          echo ""

          # Still fail the pipeline
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Staging Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA:** ${{ env.SHA }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Gateway:** ${{ steps.url.outputs.api_gateway_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "Next: Operator tests staging, then runs \`./scripts/promote-to-prod.sh ${{ env.SHA }} --confirm\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**FAILED**: Smoke tests failed. Auto-rollback attempted. Check logs above." >> "$GITHUB_STEP_SUMMARY"
          fi

name: Uptime Probe (External Monitoring)

# Runs every 5 minutes to check portal health
# Creates GitHub issue on failure for alerting

on:
  # ZRP-H-004: Re-enabled after staging LIVE at b3dd56b (STAGE-024)
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allow manual trigger
    inputs:
      alert_on_failure:
        description: 'Create issue on failure'
        required: false
        default: 'true'

env:
  # INFRA-017: Use staging domain (load balancer routes to Cloud Run services)
  DOMAIN: staging.supermandi.tech

jobs:
  uptime-check:
    name: Check Portal Health
    runs-on: ubuntu-latest
    steps:
      - name: Check Gateway Health
        id: gateway
        run: |
          echo "Checking gateway health..."
          STATUS=$(curl -sS -o /tmp/gw_response -w "%{http_code}" --max-time 30 "https://${{ env.DOMAIN }}/api/v1/pos/health" 2>/dev/null || echo "000")
          echo "Gateway status: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Gateway returned $STATUS"
          fi

      - name: Check Retailer Portal
        id: retailer
        run: |
          echo "Checking retailer portal..."
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://${{ env.DOMAIN }}/retailer/" 2>/dev/null || echo "000")
          CACHE=$(curl -sI --max-time 30 "https://${{ env.DOMAIN }}/retailer/" 2>/dev/null | grep -i "cache-control" | head -1 || echo "none")
          echo "Retailer status: $STATUS"
          echo "Cache-Control: $CACHE"
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            echo "::error::Retailer portal returned $STATUS"
          fi

      - name: Check Admin Portal
        id: admin
        run: |
          echo "Checking admin portal..."
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://${{ env.DOMAIN }}/admin/" 2>/dev/null || echo "000")
          CACHE=$(curl -sI --max-time 30 "https://${{ env.DOMAIN }}/admin/" 2>/dev/null | grep -i "cache-control" | head -1 || echo "none")
          echo "Admin status: $STATUS"
          echo "Cache-Control: $CACHE"
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            echo "::error::Admin portal returned $STATUS"
          fi

      - name: Check Supplier Portal
        id: supplier
        run: |
          echo "Checking supplier portal..."
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://${{ env.DOMAIN }}/supplier/" 2>/dev/null || echo "000")
          CACHE=$(curl -sI --max-time 30 "https://${{ env.DOMAIN }}/supplier/" 2>/dev/null | grep -i "cache-control" | head -1 || echo "none")
          echo "Supplier status: $STATUS"
          echo "Cache-Control: $CACHE"
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supplier portal returned $STATUS"
          fi

      - name: Check Version Fingerprints
        id: versions
        run: |
          echo "Checking version fingerprints..."
          FINGERPRINT_FAILURES=""

          for portal in retailer admin supplier; do
            STATUS=$(curl -sS -o /tmp/${portal}_version.txt -w "%{http_code}" --max-time 30 "https://${{ env.DOMAIN }}/$portal/version.txt" 2>/dev/null || echo "000")
            echo "--- $portal/version.txt (HTTP $STATUS) ---"

            if [ "$STATUS" = "200" ]; then
              cat /tmp/${portal}_version.txt
              # Verify it contains expected fields
              if grep -q "^tag=" /tmp/${portal}_version.txt && grep -q "^sha=" /tmp/${portal}_version.txt; then
                echo "✓ Valid fingerprint"
              else
                echo "::error::$portal version.txt missing required fields"
                FINGERPRINT_FAILURES="$FINGERPRINT_FAILURES$portal (invalid format), "
              fi
            else
              echo "::error::$portal version.txt returned $STATUS"
              FINGERPRINT_FAILURES="$FINGERPRINT_FAILURES$portal ($STATUS), "
            fi
            echo ""
          done

          echo "fingerprint_failures=$FINGERPRINT_FAILURES" >> $GITHUB_OUTPUT

      - name: Evaluate Results
        id: evaluate
        run: |
          FAILED=0
          FAILURES=""

          if [ "${{ steps.retailer.outputs.status }}" != "200" ]; then
            FAILED=1
            FAILURES="$FAILURES- Retailer: ${{ steps.retailer.outputs.status }}\n"
          fi

          if [ "${{ steps.admin.outputs.status }}" != "200" ]; then
            FAILED=1
            FAILURES="$FAILURES- Admin: ${{ steps.admin.outputs.status }}\n"
          fi

          if [ "${{ steps.supplier.outputs.status }}" != "200" ]; then
            FAILED=1
            FAILURES="$FAILURES- Supplier: ${{ steps.supplier.outputs.status }}\n"
          fi

          # Check version fingerprints (FAIL if missing after first deploy)
          FINGERPRINT_ISSUES="${{ steps.versions.outputs.fingerprint_failures }}"
          if [ -n "$FINGERPRINT_ISSUES" ]; then
            FAILED=1
            FAILURES="$FAILURES- Version fingerprints: $FINGERPRINT_ISSUES\n"
          fi

          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "failures<<EOF" >> $GITHUB_OUTPUT
          echo -e "$FAILURES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ $FAILED -eq 1 ]; then
            echo "::error::One or more portals are DOWN or fingerprints invalid"
            exit 1
          fi

          echo "✅ All portals are healthy with valid fingerprints"

      # ZRP-H-008: Health endpoint latency check
      - name: "ZRP-H-008: Health Latency Check"
        if: success()
        run: |
          echo "Checking API health latency..."
          LATENCY=$(curl -sf --max-time 10 -o /dev/null -w "%{time_total}" "https://${{ env.DOMAIN }}/api/v1/pos/health" 2>/dev/null || echo "99")
          LATENCY_MS=$(echo "$LATENCY" | awk '{printf "%.0f", $1 * 1000}')
          echo "Health endpoint latency: ${LATENCY}s (${LATENCY_MS}ms)"
          if [ "$LATENCY_MS" -gt 5000 ]; then
            echo "::warning::Health endpoint latency is high: ${LATENCY_MS}ms (>5000ms)"
          fi

      - name: Create Alert Issue
        if: failure() && github.event.inputs.alert_on_failure != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 ALERT: Portal(s) DOWN - ${new Date().toISOString()}`;
            const body = `
            ## Uptime Probe Failed

            **Time**: ${new Date().toISOString()}
            **Domain**: ${{ env.DOMAIN }}

            ### Portal Status
            | Portal | Status |
            |--------|--------|
            | Retailer | ${{ steps.retailer.outputs.status }} |
            | Admin | ${{ steps.admin.outputs.status }} |
            | Supplier | ${{ steps.supplier.outputs.status }} |

            ### Version Fingerprint Issues
            ${{ steps.versions.outputs.fingerprint_failures || 'None' }}

            ### Action Required (Cloud Run)
            1. Check Cloud Run logs: \`gcloud run services logs read api-gateway --region=asia-south1 --project=supermandi-backend --limit=50\`
            2. Check service status: \`gcloud run services describe api-gateway --region=asia-south1 --project=supermandi-backend\`
            3. Check /version: \`curl <GATEWAY_URL>/version\`

            ---
            *This issue was automatically created by the uptime probe workflow.*
            `;

            // Check for existing open issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime-alert'
            });

            if (issues.length === 0) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['uptime-alert', 'critical']
              });
              console.log('Created new alert issue');
            } else {
              // Comment on existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `## Update: ${new Date().toISOString()}\n\nProbe still failing.\n\n| Portal | Status |\n|--------|--------|\n| Retailer | ${{ steps.retailer.outputs.status }} |\n| Admin | ${{ steps.admin.outputs.status }} |\n| Supplier | ${{ steps.supplier.outputs.status }} |`
              });
              console.log('Added comment to existing issue');
            }

  # Optional: Close alert issue when all clear
  auto-close-alert:
    name: Auto-Close Alert
    runs-on: ubuntu-latest
    needs: uptime-check
    if: success()
    steps:
      - name: Close Alert Issues
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime-alert'
            });

            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `## ✅ Resolved\n\nAll portals are now healthy.\n\n**Time**: ${new Date().toISOString()}`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              console.log(`Closed issue #${issue.number}`);
            }

# GO-LIVE-SOP: Production Nginx Configuration for SuperMandi Portals
# This config ensures HTML always fetches fresh while hashed assets are cached

# Upstream for API Gateway
upstream api_gateway {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Upstream for Supplier Portal (Next.js)
upstream supplier_portal {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name supermandi.tech www.supermandi.tech;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name supermandi.tech www.supermandi.tech;

    # SSL Configuration (adjust paths as needed)
    ssl_certificate /etc/letsencrypt/live/supermandi.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supermandi.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Logging
    access_log /var/log/nginx/supermandi.access.log;
    error_log /var/log/nginx/supermandi.error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Root for static files
    root /var/www/supermandi;

    # ==========================================================================
    # ADMIN PORTAL (/admin/)
    # ==========================================================================

    # GO-LIVE-SOP: HTML files - NEVER cache
    location = /admin/ {
        alias /var/www/admin/;
        try_files /index.html =404;

        # CRITICAL: Prevent any caching of HTML
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /admin/index.html {
        alias /var/www/admin/index.html;

        # CRITICAL: Prevent any caching of HTML
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # GO-LIVE-SOP: Hashed assets - cache forever (they have content hash in filename)
    location ~* ^/admin/assets/.*\.(js|css)$ {
        alias /var/www/admin/;
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
    }

    # Admin SPA fallback - HTML requests get no-cache
    location /admin/ {
        alias /var/www/admin/;
        try_files $uri $uri/ /admin/index.html;

        # Default to no-cache for HTML, browser will use hashed URLs for assets
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ==========================================================================
    # RETAILER PORTAL (/retailer/)
    # ==========================================================================

    # GO-LIVE-SOP: HTML files - NEVER cache
    location = /retailer/ {
        alias /var/www/retailer/;
        try_files /index.html =404;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /retailer/index.html {
        alias /var/www/retailer/index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # GO-LIVE-SOP: Hashed assets - cache forever
    location ~* ^/retailer/assets/.*\.(js|css)$ {
        alias /var/www/retailer/;
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
    }

    # Retailer SPA fallback
    location /retailer/ {
        alias /var/www/retailer/;
        try_files $uri $uri/ /retailer/index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ==========================================================================
    # SUPPLIER PORTAL (/supplier/) - Next.js Server
    # ==========================================================================

    # Serve supplier version.txt directly from file system (not via Next.js)
    location = /supplier/version.txt {
        alias /home/supermanditech/supplier-portal/public/version.txt;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Type "text/plain" always;
    }

    # GO-LIVE-SOP: Proxy to Next.js server
    location /supplier/ {
        proxy_pass http://supplier_portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # GO-LIVE-SOP: Prevent caching of HTML responses
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # GO-LIVE-SOP: Next.js static assets - cache forever (they have content hash)
    location ~* ^/supplier/_next/static/.*$ {
        proxy_pass http://supplier_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
    }

    # ==========================================================================
    # API GATEWAY (/api/)
    # ==========================================================================

    location /api/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # No caching for API responses
        add_header Cache-Control "no-store" always;
    }

    # ==========================================================================
    # ROOT REDIRECT
    # ==========================================================================

    location = / {
        return 302 /retailer/;
    }

    # ==========================================================================
    # STATIC FILES (images, fonts, etc.)
    # ==========================================================================

    location ~* \.(ico|gif|jpe?g|png|svg|woff2?|ttf|eot|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ==========================================================================
    # SECURITY HEADERS
    # ==========================================================================

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Docker Compose Production - V3.0.9 compliant
# Full production stack with all microservices

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: supermandi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supermandi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-supermandi}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # NOTE: Migrations are applied by main-backend on startup (scripts/migrate-prod.js)
      # Do NOT mount to docker-entrypoint-initdb.d to avoid double-run and ordering issues
    # GL-CRIT-0017: Bind to localhost only - no external access
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supermandi} -d ${POSTGRES_DB:-supermandi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - supermandi-network
      # GL-CRIT-0050: Database on isolated db-network
      - db-network
    deploy:
      resources:
        limits:
          # GL-CRIT-0025: Add CPU limits
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: supermandi-redis
    restart: unless-stopped
    # CRITICAL: AOF persistence for Bull queue durability (V3.0.9)
    # FIX: stop-writes-on-bgsave-error=no prevents 500s when disk is low (2026-01-18)
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --stop-writes-on-bgsave-error no
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    # GL-CRIT-0018: Bind to localhost only - no external access
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - supermandi-network
      # GL-CRIT-0050: Redis on isolated db-network
      - db-network
    deploy:
      resources:
        limits:
          # GL-CRIT-0025: Add CPU limits
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # NGINX REVERSE PROXY (GL-CRIT-0026: HTTPS/TLS termination)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: supermandi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - supermandi-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ---------------------------------------------------------------------------
  # API GATEWAY
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: supermandi-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      ADMIN_SERVICE_URL: http://main-backend:3010
      PLATFORM_SERVICE_URL: http://platform-service:3002
      SUPPLIER_SERVICE_URL: http://supplier-service:3003
      CATALOG_SERVICE_URL: http://catalog-service:3004
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      ORDER_SERVICE_URL: http://order-service:3006
      REORDER_SERVICE_URL: http://reorder-service:3007
      POS_SERVICE_URL: http://main-backend:3010
      VOICE_SERVICE_URL: http://voice-service:3008
      # GL-CRIT-0006: ADMIN_TOKEN must be set in .env - no fallback for security
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-supermandi-auth}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      platform-service:
        condition: service_healthy
      main-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - supermandi-network
    deploy:
      resources:
        limits:
          # GL-CRIT-0025: Add CPU limits
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # AUTH SERVICE
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: supermandi-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-supermandi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supermandi}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-supermandi-auth}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      # Firebase Auth (Retailer Admin Portal OTP)
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-true}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: /etc/supermandi/firebase-service-account.json
      # Go-live testing bypass (TEMPORARY - set to 'true' for testing, remove after go-live)
      ALLOW_BYPASS_FOR_TESTING: ${ALLOW_BYPASS_FOR_TESTING:-false}
    volumes:
      - /etc/supermandi/firebase-service-account.json:/etc/supermandi/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - supermandi-network
    deploy:
      resources:
        limits:
          # GL-CRIT-0025: Add CPU limits
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # PLATFORM SERVICE
  # ---------------------------------------------------------------------------
  platform-service:
    build:
      context: .
      dockerfile: services/platform-service/Dockerfile
    container_name: supermandi-platform-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      PLATFORM_SERVICE_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-supermandi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supermandi}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - supermandi-network
    deploy:
      resources:
        limits:
          # GL-CRIT-0025: Add CPU limits
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # MAIN BACKEND (MONOLITH)
  # ---------------------------------------------------------------------------
  main-backend:
    build:
      context: .
      dockerfile: Dockerfile.main
    container_name: supermandi-main-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3010
      DATABASE_URL: postgresql://${POSTGRES_USER:-supermandi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supermandi}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      # GL-CRIT-0006: ADMIN_TOKEN must be set in .env - no fallback for security
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - supermandi-network
    deploy:
      resources:
        limits:
          # GL-CRIT-0025: Add CPU limits
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ---------------------------------------------------------------------------
  # SUPPLIER SERVICE
  # ---------------------------------------------------------------------------
  supplier-service:
    build:
      context: .
      dockerfile: services/supplier-service/Dockerfile
    container_name: supermandi-supplier-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SUPPLIER_SERVICE_PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-supermandi}
      DB_USER: ${POSTGRES_USER:-supermandi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # GL-CRIT-0002: Required for auth middleware
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-supermandi-auth}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - supermandi-network
    deploy:
      resources:
        limits:
          # GL-CRIT-0025: Add CPU limits
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # CATALOG SERVICE
  # ---------------------------------------------------------------------------
  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    container_name: supermandi-catalog-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CATALOG_SERVICE_PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-supermandi}
      DB_USER: ${POSTGRES_USER:-supermandi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # GL-CRIT-0004/0007: Required for auth middleware
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-supermandi-auth}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - supermandi-network
    deploy:
      resources:
        limits:
          # GL-CRIT-0025: Add CPU limits
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # INVENTORY SERVICE
  # ---------------------------------------------------------------------------
  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: supermandi-inventory-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INVENTORY_SERVICE_PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-supermandi}
      DB_USER: ${POSTGRES_USER:-supermandi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # GL-CRIT-0005: Required for auth middleware
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-supermandi-auth}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - supermandi-network
    deploy:
      resources:
        limits:
          # GL-CRIT-0025: Add CPU limits
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # ORDER SERVICE
  # ---------------------------------------------------------------------------
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: supermandi-order-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ORDER_SERVICE_PORT: 3006
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-supermandi}
      DB_USER: ${POSTGRES_USER:-supermandi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # GL-CRIT-0001: Required for auth middleware
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-supermandi-auth}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - supermandi-network
    deploy:
      resources:
        limits:
          # GL-CRIT-0025: Add CPU limits
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # REORDER SERVICE
  # ---------------------------------------------------------------------------
  reorder-service:
    build:
      context: .
      dockerfile: services/reorder-service/Dockerfile
    container_name: supermandi-reorder-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REORDER_SERVICE_PORT: 3007
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-supermandi}
      DB_USER: ${POSTGRES_USER:-supermandi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # GL-CRIT-0003: Required for auth middleware
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-supermandi-auth}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - supermandi-network
    deploy:
      resources:
        limits:
          # GL-CRIT-0025: Add CPU limits
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # VOICE SERVICE
  # GL-CRIT-0051: OpenAI API key uses Docker secrets for enhanced security
  # Secrets are mounted as files, not exposed in environment or docker inspect
  # ---------------------------------------------------------------------------
  voice-service:
    build:
      context: .
      dockerfile: services/voice-service/Dockerfile
    container_name: supermandi-voice-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VOICE_SERVICE_PORT: 3008
      # GL-CRIT-0051: API key path (read from Docker secret file)
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      # Fallback to env var for backwards compatibility during migration
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-whisper-1}
      OPENAI_STT_LANGUAGE: ${OPENAI_STT_LANGUAGE:-hi}
      VOICE_MAX_FILE_SIZE_MB: ${VOICE_MAX_FILE_SIZE_MB:-10}
    secrets:
      - openai_api_key
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - supermandi-network
    deploy:
      resources:
        limits:
          # GL-CRIT-0025: Add CPU limits
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:
    name: supermanditech_postgres-data
  redis-data:
    name: supermanditech_redis-data

# =============================================================================
# NETWORKS
# GL-CRIT-0050: Network isolation for defense in depth
# - db-network: Only accessible by services that need direct DB access
# - internal-network: Internal service-to-service communication
# - public-network: Services exposed to the internet (api-gateway only)
# =============================================================================
networks:
  supermandi-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
  # GL-CRIT-0050: Database tier - isolated network for DB access only
  db-network:
    driver: bridge
    internal: true  # No external access
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/24
  # GL-CRIT-0050: Internal services network - no direct internet access
  internal-network:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/24

# =============================================================================
# SECRETS (GL-CRIT-0051: Secure secret management)
# =============================================================================
secrets:
  openai_api_key:
    # GL-CRIT-0051: OpenAI API key stored as Docker secret
    # Create with: echo "sk-your-key" | docker secret create openai_api_key -
    # Or use file: docker secret create openai_api_key /path/to/key/file
    external: true

# SonarCloud / SonarQube Configuration for SuperMandi POS
# Runs via GitHub Actions CI gate

sonar.projectKey=supermandi-pos
sonar.organization=supermandi
sonar.projectName=SuperMandi POS

# Source directories (all 5 apps)
sonar.sources=\
  backend/src,\
  retailer-admin/src,\
  supermandi-superadmin/src,\
  supplier-portal/src,\
  src

# Test directories
sonar.tests=\
  backend/tests,\
  retailer-admin/src/__tests__,\
  supermandi-superadmin/src/__tests__,\
  supplier-portal/src/__tests__,\
  src/__tests__

# Exclusions — generated files, configs, node_modules
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/migrations/**,\
  **/scripts/**,\
  **/e2e-tests/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/setup.ts

# Test inclusions for coverage mapping
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Language settings
sonar.language=ts
sonar.typescript.lcov.reportPaths=\
  backend/coverage/lcov.info,\
  retailer-admin/coverage/lcov.info,\
  supermandi-superadmin/coverage/lcov.info,\
  supplier-portal/coverage/lcov.info,\
  coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality gate thresholds
sonar.qualitygate.wait=true

# Duplicate detection
sonar.cpd.typescript.minimumTokens=50
sonar.cpd.typescript.minimumLines=10

# Issue severity
sonar.issue.ignore.multicriteria=e1,e2
# Ignore "cognitive complexity" in test files
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.*
# Ignore "too many parameters" in test mocks
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S107
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.*

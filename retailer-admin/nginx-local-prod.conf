# POST-BATCH-017: Retailer Admin - local-prod nginx config
# Serves SPA under /retailer/ subpath (matches Vite base: '/retailer/')
# Mounted via docker-compose volume over /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # URL-001: Security headers for all responses
    # CSP-RECAPTCHA-001: script-src and frame-src include https://www.google.com
    # for Firebase Phone Auth invisible reCAPTCHA verification
    # CSP-FONTS-001: style-src includes fonts.googleapis.com, font-src includes fonts.gstatic.com
    # for Google Fonts (Inter) used in retailer-admin index.css @import
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com; frame-src 'self' https://*.firebaseapp.com https://www.google.com" always;

    # Docker healthcheck endpoint (must stay at root path)
    location = /health.txt {
        # Served directly from root
    }

    # Redirect bare / to /retailer/
    location = / {
        return 302 /retailer/;
    }

    # Assets with immutable cache headers
    location ~* ^/retailer/assets/ {
        rewrite ^/retailer/(.*) /$1 break;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # URL-001: Re-add security headers (nginx add_header in nested block overrides parent)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # URL-118: Return 404 for static file extensions that don't exist (not SPA fallback)
    location ~* ^/retailer/.*\.(svg|png|ico|jpg|jpeg|gif|webp|woff2?|ttf|eot|map)$ {
        rewrite ^/retailer/(.*) /$1 break;
        try_files $uri =404;
    }

    # All /retailer/ paths - strip prefix, serve SPA with fallback
    # URL-003: Add no-cache for HTML to ensure fresh content after deploys
    # NOTE: add_header in location block overrides ALL server-level headers.
    # Every header needed for this location MUST be repeated here.
    location /retailer/ {
        rewrite ^/retailer/(.*) /$1 break;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP-FONTS-001: style-src includes fonts.googleapis.com, font-src includes fonts.gstatic.com
        # for Google Fonts (Inter) used in retailer-admin index.css @import
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com; frame-src 'self' https://*.firebaseapp.com https://www.google.com" always;
    }
}

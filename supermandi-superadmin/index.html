<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/admin/favicon.svg" /> <!-- T-078: Brand shortmark -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- FIX-063: Content Security Policy — defense-in-depth (server CSP headers recommended too) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.run.app https://*.googleapis.com; frame-src 'none'; object-src 'none'; base-uri 'self';" />
    <!-- Google Fonts: Inter for consistent typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>SuperMandi SuperAdmin</title>
    <!-- GO-LIVE-099: PWA manifest -->
    <link rel="manifest" href="/admin/manifest.json" />
    <meta name="theme-color" content="#2563EB" /> <!-- T-078: Brand primary -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- GO-LIVE-099: Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/admin/sw.js')
            .then(function(registration) {
              console.log('[App] Service worker registered:', registration.scope);
            })
            .catch(function(error) {
              console.warn('[App] Service worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>

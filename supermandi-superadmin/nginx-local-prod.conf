# POST-BATCH-017: SuperAdmin - local-prod nginx config
# Serves SPA under /admin/ subpath (matches Vite base: '/admin/')
# Mounted via docker-compose volume over /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker healthcheck endpoint (must stay at root path)
    location = /health.txt {
        # Served directly from root
    }

    # Redirect bare / to /admin/
    location = / {
        return 302 /admin/;
    }

    # Assets with immutable cache headers
    location ~* ^/admin/assets/ {
        rewrite ^/admin/(.*) /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # All /admin/ paths - strip prefix, serve SPA with fallback
    location /admin/ {
        rewrite ^/admin/(.*) /$1 break;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # LIVE.SECURITY.CACHE_HEADERS.001: Prevent browser caching of SPA HTML shell
        add_header Cache-Control "no-cache" always;
    }
}
